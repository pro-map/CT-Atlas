name: Build lightweight map data
description: >
  Derive events-lite.json (events.json without the collector's bookkeeping fields, which
  neither the map nor the Worker read) and events-map.json (only the attacks the map shows,
  plus a whole-database summary) from the events.json in the checkout, right before the site
  is published. Builders retain their fallbacks; final integrity validation blocks incomplete publication. The
  map and the Worker fall back to the next larger file. It also leaves the background jobs'
  data (archive/, quota/) out of the published site: nothing on the site reads it, and it
  grows every night.
runs:
  using: composite
  steps:
    # Most deploy jobs set up no Python of their own, so ubuntu-latest would choose one
    # job by job. It stays set for the rest of the job: their verify steps use it too.
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    # Rebuilds events.json from data/events/ once the store is the database, or checks
    # that the two agree (docs/STORAGE_MIGRATION.md). The site still serves events.json.
    - name: Materialize events.json from the store
      shell: bash
      run: python3 events_store.py materialize
    - name: Build events-lite.json
      shell: bash
      run: |
        if python3 tools/build_events_lite.py; then
          echo "events-lite.json built."
        else
          rm -f events-lite.json
          echo "::warning::events-lite.json could not be built; the map and the Worker will use the full events.json."
        fi
    - name: Build events-map.json
      shell: bash
      run: |
        if python3 tools/build_events_map.py; then
          echo "events-map.json built."
        else
          rm -f events-map.json
          echo "::warning::events-map.json could not be built; the map will filter events-lite.json itself."
        fi
    - name: Validate the publication dataset and record its manifest
      shell: bash
      run: python3 tools/daily_publication_audit.py manifest --output publication-manifest.json
    - name: Leave the background jobs' data out of the site
      shell: bash
      run: |
        rm -f daily_candidate_queue.json daily-collection-status.json
        # Internal checkpoints nothing on the site reads (the AI cache alone
        # was half of every Pages upload).
        rm -f ai_article_selection_cache.json incident_consolidation_state.json
        rm -f map-integrity-decisions.json
        rm -rf archive quota
        # The monthly store events.json was rebuilt from; the site serves events.json.
        rm -rf data/events
        rm -f events.json.store-base
