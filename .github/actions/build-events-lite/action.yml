name: Build lightweight map data
description: >
  Derive events-lite.json (events.json without the collector's bookkeeping fields, which
  neither the map nor the Worker read) from the events.json in the checkout, right before
  the site is published. Never fails the deployment: if the file
  cannot be built it is removed, and the map and the Worker fall back to the full events.json.
runs:
  using: composite
  steps:
    - name: Build events-lite.json
      shell: bash
      run: |
        if python3 tools/build_events_lite.py; then
          echo "events-lite.json built."
        else
          rm -f events-lite.json
          echo "::warning::events-lite.json could not be built; the map and the Worker will use the full events.json."
        fi
