name: Category migration review
on:
  push:
    branches: [ct-categories-six-months-20261008]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Package offline test dependencies
        run: pip download --dest "$RUNNER_TEMP/wheels" feedparser geonamescache
      - uses: actions/upload-artifact@v6
        with:
          name: category-test-dependencies
          path: ${{ runner.temp }}/wheels/
          retention-days: 1
