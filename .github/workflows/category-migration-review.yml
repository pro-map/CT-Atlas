name: Category migration review
on:
  push:
    branches: [ct-categories-six-months-20261008]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: map-six-month-review
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ct-categories-six-months-20261008
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Apply the previously reviewed migration
        run: |
          python - <<'PY'
          import subprocess
          source=subprocess.check_output(['git','show','64936ebc4b562fd3aee17c58557b1dff06238d45:.github/workflows/category-migration-review.yml'],text=True).splitlines()
          start=source.index("          python - <<'PY'")+1
          end=source.index('          PY',start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end])
          exec(compile(code,'reviewed-map-migration','exec'))
          PY
      - name: Validate map payload tests
        run: python -m unittest discover -s tests -p 'build_events_map_test.py'
      - name: Run JavaScript regression tests
        run: node --test tests/*.test.cjs
      - name: Validate six-month database
        run: python tools/build_events_map.py --output "$RUNNER_TEMP/events-map.json"
      - name: Prepare tested Git objects without updating a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,subprocess,urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          def post(route,payload):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/'+route,
                  data=json.dumps(payload).encode(),method='POST',headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json','Content-Type':'application/json',
                  'User-Agent':'CT-Atlas-map-migration'})
              with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
          paths=['index.html','tools/build_events_map.py','tests/attacks-map-database.test.cjs',
                 'tests/build_events_map_test.py','tests/map-default-period.test.cjs',
                 '.github/workflows/deploy-current-ct-atlas-ui.yml','.github/workflows/live-smoke.yml']
          entries=[]
          for path in paths:
              blob=post('blobs',{'content':base64.b64encode(Path(path).read_bytes()).decode(),'encoding':'base64'})
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          entries.append({'path':'.github/workflows/category-migration-review.yml','mode':'100644','type':'blob','sha':None})
          base=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          parent=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tree=post('trees',{'base_tree':base,'tree':entries})
          commit=post('commits',{'message':'Extend map to 180 days for every category and event type','tree':tree['sha'],'parents':[parent]})
          print('REVIEWED_COMMIT='+commit['sha'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Validated 180-day all-category map. No branch was changed.\n\nReviewed commit: `'+commit['sha']+'`\n')
          PY
