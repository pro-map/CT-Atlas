name: Enrich specialist categories

on:
  push:
    branches: [main]
    paths:
      - radnuc.py
      - threat_categories.py
      - threat-category-keywords.json
      - tools/enrich_threat_categories.py
      - tools/specialist_catchup.py
      - specialist-catchup.json
      - tools/migrate_threat_categories.py
      - tools/enrich_radnuc.py
      - .github/workflows/enrich-radnuc.yml
  schedule:
    - cron: "43 6 * * *"
      timezone: Europe/Paris
  workflow_dispatch:
    inputs:
      continuation:
        description: Internal same-day continuation; expires automatically
        type: boolean
        default: false
      max_posts:
        description: Gemini requests (same-day catch-up preset takes priority until expiry)
        default: "60"
      max_fetches:
        description: Searches (same-day catch-up preset takes priority until expiry)
        default: "600"

permissions:
  contents: write
  pages: write
  id-token: write

# The same write lock as the daily collector protects events.json and publication.
concurrency:
  group: ct-map-update-main
  cancel-in-progress: false
  queue: max

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    outputs:
      enabled: ${{ steps.configure.outputs.enabled }}
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ENRICH_MAX_POSTS: ${{ inputs.max_posts || '60' }}
      ENRICH_MAX_FETCHES: ${{ inputs.max_fetches || '600' }}
      CATCHUP_CONTINUATION: ${{ inputs.continuation || false }}
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Configure expiring same-day catch-up
        id: configure
        run: python tools/specialist_catchup.py configure
      - name: Install dependencies
        if: steps.configure.outputs.enabled == 'true'
        run: pip install -r requirements.txt
      - name: Validate topic rules, daily vocabulary and resumable integration
        if: steps.configure.outputs.enabled == 'true'
        run: |
          python -m unittest discover -s tests -p 'radnuc_test.py'
          python -m unittest discover -s tests -p 'threat_categories_test.py'
      - name: Protect existing location decisions
        if: steps.configure.outputs.enabled == 'true'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          db = json.loads(Path('events.json').read_text(encoding='utf-8'))
          ids = [str(e['id']) for e in db['events'] if e.get('id') is not None]
          Path(os.environ['RUNNER_TEMP'], 'specialist-preserve-geo.json').write_text(json.dumps(ids))
          PY
      - name: Migrate retained classifications without changing evidence
        if: steps.configure.outputs.enabled == 'true'
        run: python tools/migrate_threat_categories.py --write
      - name: Backfill and integrate all three specialist categories
        if: steps.configure.outputs.enabled == 'true'
        id: enrich
        timeout-minutes: 60
        run: python -u tools/enrich_threat_categories.py --max-posts "$ENRICH_MAX_POSTS" --max-fetches "$ENRICH_MAX_FETCHES" --deadline-minutes "$ENRICH_DEADLINE_MINUTES"
      - name: Locate newly integrated events
        if: ${{ always() && steps.enrich.outcome == 'success' }}
        timeout-minutes: 40
        env:
          AI_GEO_FORCE: "0"
          AI_GEO_PRESERVE_IDS_FILE: ${{ runner.temp }}/specialist-preserve-geo.json
        run: python -u geolocate.py
      - name: Publish readable backfill progress in the run summary
        if: ${{ always() && steps.configure.outputs.enabled == 'true' }}
        run: python tools/specialist_catchup.py summary
      - name: Preserve enrichment recovery artifact
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.configure.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: specialist-enrichment-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            events.json
            archive/threat-*.json
            archive/threat-enrichment-status.md
            archive/radnuc-*.json
            archive/biological-*.json
            archive/chemical-explosives-*.json
            archive/radnuc-v1-seen-*.txt
            archive/biological-v1-seen-*.txt
            archive/chemical-explosives-v1-seen-*.txt
            archive/enriched-articles-*.json
            archive/enrichment-seen-*.txt
            quota/gemini-3.1-enrichment.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit validated database and resumable checkpoints
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.configure.outputs.enabled == 'true' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          db = json.loads(Path('events.json').read_text(encoding='utf-8'))
          if not isinstance(db.get('events'), list) or not db['events']:
              raise RuntimeError('Invalid specialist database checkpoint')
          for folder in ('archive', 'quota'):
              for path in Path(folder).glob('*.json'):
                  json.loads(path.read_text(encoding='utf-8'))
          PY
          git config user.name "CT Intelligence Map Bot"
          git config user.email "actions@github.com"
          git add -- events.json archive quota
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integrate specialist category backfill and preserve checkpoints"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Concurrent write conflict; recovery artifact retained."
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 4))
          done
          exit 1
  deploy:
    needs: enrich
    if: ${{ always() && needs.enrich.result == 'success' && needs.enrich.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - name: Build map and full database payloads
        uses: ./.github/actions/build-events-lite
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - uses: actions/deploy-pages@v5
        id: deployment

  continue-today:
    needs: [enrich, deploy]
    if: ${{ needs.enrich.outputs.enabled == 'true' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Check completion, provider limits, safety cap and expiry
        id: next
        run: python3 tools/specialist_catchup.py next
      - name: Resume the next checkpointed batch immediately
        if: steps.next.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' '{"ref":"main","inputs":{"continuation":"true"}}' | \
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/enrich-radnuc.yml/dispatches" --input -
          echo 'Next same-day batch requested. This is not a claim of completed backfill.' >> "$GITHUB_STEP_SUMMARY"
