name: Actualiser le logo uniquement

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ct-map-update-main
  cancel-in-progress: false

jobs:
  logo:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Update only logo URLs
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import re
          from pathlib import Path

          asset = Path("CT-ATLAS.png")
          data = asset.read_bytes()
          if not data.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("CT-ATLAS.png is missing or is not a PNG image")
          version = hashlib.sha256(data).hexdigest()[:16]
          url = f"CT-ATLAS.png?v={version}"
          page = Path("index.html")
          original = page.read_bytes()
          pattern = rb"""(\b(?:src|href)\s*=\s*["'])(?:\./)?(?:ct-atlas|CT-ATLAS|interpol-logo)\.png(?:\?[^"'<>\s]*)?(["'])"""
          updated, count = re.subn(
              pattern,
              lambda match: match[1] + url.encode("ascii") + match[2],
              original,
          )
          if count == 0:
              raise SystemExit("No known logo URLs found; index.html was not changed")
          page.write_bytes(updated)
          print(f"Updated {count} logo URLs to {url}")
          PY

      - name: Commit only logo references
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          if ! git diff --cached --quiet; then
            git commit -m "Refresh CT Atlas logo only"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build lightweight map data (events-lite.json)
        uses: ./.github/actions/build-events-lite
      - name: Upload current website
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
