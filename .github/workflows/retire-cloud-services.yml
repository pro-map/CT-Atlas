name: Retire Social and Facial cloud services

# One-shot, removed by the next commit once it has run. The owner retired the
# Social, Dark Web and Facial tools on 2026-11-06: this stops their two public
# Cloud Run services and removes the Worker secrets only they used. Stateless
# compute and configuration only: no stored data is touched.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retire-cloud-services.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ct-atlas-shared-worker-deployment
      queue: max
      cancel-in-progress: false
    env:
      GCP_PROJECT_ID: ct-atlas
      GCP_REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
      ARTIFACT_REPOSITORY: ct-atlas-agents
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ct-atlas

      - name: Delete the Cloud Run services
        shell: bash
        run: |
          set -euo pipefail
          for service in ct-atlas-socmint-agent ct-atlas-visual-intel; do
            if gcloud run services describe "$service" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" >/dev/null 2>&1; then
              gcloud run services delete "$service" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet
              echo "::notice title=Retired::Cloud Run service $service deleted"
            else
              echo "::notice title=Retired::Cloud Run service $service was already gone"
            fi
          done

      - name: Delete their container images
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          for package in ct-atlas-socmint-agent ct-atlas-visual-intel; do
            image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$package"
            if gcloud artifacts docker images delete "$image" --delete-tags --quiet; then
              echo "::notice title=Retired::Images of $package deleted"
            else
              echo "::warning title=Retire images::Could not delete the images of $package"
            fi
          done

      - name: Remove the Worker secrets only these tools used
        shell: bash
        run: |
          set -uo pipefail
          for name in SOCMINT_AGENT_URL SOCMINT_AGENT_SHARED_SECRET BRAVE_SEARCH_API_KEY \
                      VISUAL_INTEL_URL VISUAL_INTEL_SHARED_SECRET DARKWEB_INGEST_TOKEN \
                      DARKWEB_ENRICH_DAILY DARKWEB_GEMINI_MODEL DARKWEB_GEMINI_MODELS \
                      DARKWEB_TRANSLATION_PROVIDER DARKWEB_EXTERNAL_AI_APPROVED \
                      GEMINI_SOCMINT_MODEL GEMINI_SOCMINT_SEARCH_MODEL; do
            if printf 'y\n' | python3 tools/wrangler_retry.py secret delete "$name" --config cloudflare-worker/wrangler.toml; then
              echo "::notice title=Retired::Worker secret $name removed"
            else
              echo "$name was not a Worker secret, or was already gone."
            fi
          done
