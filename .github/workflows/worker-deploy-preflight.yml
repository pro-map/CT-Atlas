name: Worker deploy preflight

on:
  pull_request:
    paths:
      - "cloudflare-worker/**"
      - "tests/**"
      - "ct-atlas-runtime.json"
      - "index.html"
      - ".github/workflows/deploy-report-worker.yml"
      - ".github/workflows/worker-deploy-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Validate Worker JavaScript and full regression suite
        run: |
          for file in cloudflare-worker/*.js; do
            node --input-type=module --check < "$file"
          done
          node --check crypto.js
          node --test tests/*.test.cjs
      - name: Validate supporting Python scripts
        run: |
          python3 tests/quiz_source_test.py
          python3 tests/update_sanctions_test.py
          python3 tests/build_events_lite_test.py
          python3 tests/build_events_map_test.py
