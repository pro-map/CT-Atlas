name: Experimental external-model comparison (public synthetic, no API)
# Branch only. Never consumes Groq, Cloudflare Workers AI or Gemini credits.
# No secrets injected and no writes to events.json, quotas, or production.
on:
  push:
    branches:
      - experiment/groq-glm-readonly-pilot-20261010
    paths:
      - .github/workflows/external-llm-public-synthetic-pilot.yml
      - experiments/external_llm_pilot.py
      - experiments/external_llm_metrics.py
      - experiments/fixtures/external_llm_public_synthetic.json
      - tests/external_llm_pilot_test.py
      - tests/external_llm_metrics_test.py

permissions:
  contents: read

concurrency:
  group: external-synthetic-pilot-test
  cancel-in-progress: true

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install existing Python dependencies
        run: pip install -r requirements.txt
      - name: Validate fixed public-synthetic fixtures and fail-closed provider adapters
        run: python -m unittest discover -s tests -p 'external_llm_pilot_test.py' -v
      - name: Validate synthetic evaluation metrics (including false positives and geography)
        run: python -m unittest discover -s tests -p 'external_llm_metrics_test.py' -v
      - name: Exercise both model request plans WITHOUT credentials, egress or billing
        run: |
          python experiments/external_llm_pilot.py --mode plan --provider both --max-per-provider 2
          python experiments/external_llm_pilot.py --mode coverage --provider both --max-per-provider 26
      - name: Explain limits
        run: |
          echo 'This workflow contains NO live model calls and NO empirical quality benchmark.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Real-model fidelity must be measured later, on institutionally authorized data and verified free plans.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Do not modify any CT ATLAS production collector, Gemini quota, D1 records or Cloudflare Workers.' >> "$GITHUB_STEP_SUMMARY"
