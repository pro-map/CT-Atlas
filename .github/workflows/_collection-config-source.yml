name: Collection configuration source snapshot

# Temporary branch-only audit helper; removed before merge. No API/AI secrets.
on:
  push:
    branches: [fix/shared-collection-config-20261012]
    paths: [.github/workflows/_collection-config-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Package the existing test dependencies without calling collection
        run: python -m pip wheel -r requirements.txt -r darkweb-collector/requirements.txt --wheel-dir "$RUNNER_TEMP/wheels"
      - uses: actions/upload-artifact@v6
        with:
          name: collection-config-test-wheels
          path: ${{ runner.temp }}/wheels/
          retention-days: 1
