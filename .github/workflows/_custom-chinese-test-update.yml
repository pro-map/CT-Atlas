name: Update Custom Intelligence cache-version regression

# One-time feature-branch preparation; removed before merge.
on:
  push:
    branches: [feat/custom-intelligence-chinese-20261012]
    paths: [.github/workflows/_custom-chinese-test-update.yml]

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'pro-map/CT-Atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/custom-intelligence-chinese-20261012
      - name: Update the existing assertion without changing other tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('tests/background-corpus.test.cjs')
          raw=p.read_bytes()
          sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          if sha != '2fd9317c266961357b306a2d72419c54978c91b8':
              raise SystemExit('Unexpected test revision; no changes applied')
          old=b'deep-search-v15-atlas-ai'
          if raw.count(old) != 1:
              raise SystemExit('Unexpected version assertion count')
          p.write_bytes(raw.replace(old,b'deep-search-v16-chinese-scripts'))
          PY
          node --test tests/background-corpus.test.cjs tests/custom-intelligence-chinese.test.cjs tests/deep-search-recall.test.cjs tests/deep-search-gemini-retry.test.cjs
      - name: Commit only the updated regression assertion
        run: |
          set -euo pipefail
          git config user.name 'CT Intelligence Map Bot'
          git config user.email 'actions@github.com'
          git add -- tests/background-corpus.test.cjs
          git commit -m 'Align archive regression with Chinese-enabled Deep Search cache version'
          git push origin HEAD:refs/heads/feat/custom-intelligence-chinese-20261012
