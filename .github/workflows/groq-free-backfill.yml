name: Groq Free - six-month Biological historical backfill

# Biological history only; RadNuc, ChemEx and separate Chinese map history are cancelled.
# Only PUBLIC Google News and GDELT titles/excerpts are sent to Groq.
# No Dark Web material, internal INTERPOL records or SOCMINT workspaces.
# Existing daily Gemini collection, archives and quotas remain independent.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/groq-free-backfill.yml
  schedule:
    # Two-hour checkpointed runs. Read-only preflight skips exhausted budgets.
    # Own UTC-day internal budget stops
    # further calls automatically even after manual dispatches / reruns.
    - cron: "45 */2 * * *"
      timezone: Europe/Paris
  workflow_dispatch:
    inputs:
      specialist_posts:
        description: "Groq API calls for Biological history only (max 5)"
        required: false
        default: "5"

permissions:
  contents: write
  pages: write
  id-token: write

# Coordinate with the daily collection, background jobs and the manual
# Gemini fallback using their existing global write lock.
concurrency:
  group: ct-map-update-main
  cancel-in-progress: false
  queue: max

jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run_needed: ${{ steps.check.outputs.run_needed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Read remaining historical allocation without calling AI
        id: check
        env:
          GROQ_MAINTENANCE_ONLY: ${{ (github.event_name == 'push' && !startsWith(github.event.head_commit.message, '[resume-groq-history]')) || inputs.specialist_posts == '0' }}
        run: python3 tools/groq_backfill_runtime.py preflight

  backfill:
    needs: budget
    if: needs.budget.outputs.run_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 105
    outputs:
      publication_ready: ${{ steps.checkpoint.outputs.publication_ready }}
    env:
      CT_ATLAS_BACKFILL_PROVIDER: groq
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Code-maintenance pushes repair and deploy without consuming AI quota.
      # Scheduled/manual backfills retain their existing bounded allocations.
      # An operator-approved main commit starting [resume-groq-history] opts
      # into ONE normal bounded batch; it never resets or raises daily caps.
      SPECIALIST_POSTS_INPUT: ${{ github.event_name == 'push' && !startsWith(github.event.head_commit.message, '[resume-groq-history]') && '0' || inputs.specialist_posts || '5' }}
    steps:
      - name: Checkout current production and durable checkpoints
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install existing public-news search dependencies
        run: pip install -r requirements.txt
      - name: Check key, budget and schema without calling AI
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GROQ_API_KEY" || { echo "::error::GROQ_API_KEY Actions secret missing"; exit 1; }
          python -m unittest discover -s tests -p 'groq_backfill_test.py' -v
          python -m unittest discover -s tests -p 'groq_backfill_runtime_test.py' -v
          python -m unittest discover -s tests -p 'repair_weak_incident_ids_test.py' -v
          python -m unittest discover -s tests -p 'backfill_record_integrity_test.py' -v
          python -m unittest discover -s tests -p 'backfill_publication_guard_test.py' -v
          python -m unittest discover -s tests -p 'source_faithfulness_test.py' -v
          python -m unittest discover -s tests -p 'threat_categories_test.py'
          python -m unittest discover -s tests -p 'gemini_chinese_map_test.py'
          python -m unittest discover -s tests -p 'radnuc_vocabulary_test.py'
          # The variables are reduced, never expanded, by each caller.
          python - <<'PY'
          import os
          for name,limit in (("SPECIALIST_POSTS_INPUT",5),):
              value=int(os.environ[name])
              if value < 0 or value > limit:
                  raise SystemExit(f"{name}: refusing value outside 0..{limit}")
          PY
      - name: Repair legacy record keys before old-record and geolocation snapshots
        # Renaming an existing record is not new coverage and must not trigger AI.
        run: python tools/backfill_record_integrity.py events.json --apply
      - name: Repair raw weak incident IDs before history replay
        run: python tools/repair_weak_incident_ids.py events.json
      - name: Apply documented source-faithfulness correction before snapshots
        run: python tools/apply_source_faithfulness.py --apply
      - name: Snapshot old incident IDs and protected location decisions
        id: baseline
        env:
          MAP_BASELINE: ${{ runner.temp }}/groq-backfill-baseline.json
          BEFORE: ${{ runner.temp }}/groq-backfill-before.json
          GEO_IDS: ${{ runner.temp }}/groq-geo-protected.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          db = json.loads(Path("events.json").read_text(encoding="utf-8"))
          if not isinstance(db.get("events"),list) or not db["events"]:
              raise SystemExit("Invalid pre-run Map database: refuse operation")
          ids=[str(e["id"]) for e in db["events"] if e.get("id") is not None]
          # The publication guard freezes geography for every prior record,
          # including old records whose coordinates are still missing.
          geo = ids
          Path(os.environ["BEFORE"]).write_text(json.dumps(ids),encoding="utf-8")
          Path(os.environ["GEO_IDS"]).write_text(json.dumps(geo),encoding="utf-8")
          print(f"Protected {len(ids)} prior incident IDs and {len(geo)} location decisions")
          PY
          python tools/backfill_publication_guard.py snapshot
      - name: Resume Biological historical backfill - all configured languages
        id: specialists
        timeout-minutes: 37
        if: env.SPECIALIST_POSTS_INPUT != '0'
        env:
          POSTS: ${{ env.SPECIALIST_POSTS_INPUT }}
        run: |
          set -euo pipefail
          python -u tools/enrich_threat_categories.py \
            --max-posts "$POSTS" --max-fetches 270 --deadline-minutes 12
      - name: Refuse record-key collisions or retired IDs after replay
        if: success()
        run: python tools/backfill_record_integrity.py events.json --check
      - name: Split ambiguous short incident anchors before publication
        if: success()
        run: python tools/repair_weak_incident_ids.py events.json
      - name: Check whether new records need evidence-grounded geolocation
        if: success()
        id: new_events
        env:
          BEFORE: ${{ runner.temp }}/groq-backfill-before.json
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          seen=set(json.loads(Path(os.environ["BEFORE"]).read_text(encoding="utf-8")))
          db=json.loads(Path("events.json").read_text(encoding="utf-8"))
          count=sum(str(e.get("id")) not in seen for e in db["events"])
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write(f"new_count={count}\n")
          print(f"New candidate records requiring geo check: {count}")
          PY
      - name: Validate only newly integrated records' event locations
        id: geo
        if: steps.new_events.outputs.new_count != '0' && env.GEMINI_API_KEY != ''
        timeout-minutes: 22
        env:
          AI_GEO_FORCE: "0"
          AI_GEO_PRESERVE_IDS_FILE: ${{ runner.temp }}/groq-geo-protected.json
        run: python -u geolocate.py
      - name: Quarantine newly integrated events still lacking coordinates
        id: quarantine
        if: always() && steps.new_events.outcome == 'success'
        env:
          BEFORE: ${{ runner.temp }}/groq-backfill-before.json
        run: |
          python - <<'PY'
          import json,math,os
          from datetime import datetime, timezone
          from pathlib import Path
          before=set(json.loads(Path(os.environ["BEFORE"]).read_text(encoding="utf-8")))
          p=Path("events.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          if not isinstance(data.get("events"),list) or not data["events"]:
              raise SystemExit("Malformed main Map database")
          def located(e):
              try:
                  lat,lon=float(e.get("latitude")),float(e.get("longitude"))
                  return (math.isfinite(lat) and math.isfinite(lon)
                          and -90<=lat<=90 and -180<=lon<=180)
              except (ValueError,TypeError):
                  return False
          unlocated=[e for e in data["events"]
                     if str(e.get("id")) not in before and not located(e)]
          if unlocated:
              path=Path("archive/groq-backfill-unlocated.json")
              saved=json.loads(path.read_text(encoding="utf-8")) if path.exists() else {"events":[]}
              indexed={str(e.get("id")) for e in saved.get("events",[])}
              saved["events"].extend(e for e in unlocated if str(e.get("id")) not in indexed)
              path.write_text(json.dumps(saved,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
              blocked={str(e.get("id")) for e in unlocated}
              data["events"]=[e for e in data["events"] if str(e.get("id")) not in blocked]
              p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(f"New unlocated events safely withheld: {len(unlocated)}")
          PY
      - name: Save last full checkpoint as recovery artifact even on upstream failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: groq-free-backfill-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            events.json
            archive/map-record-id-migration-v1.json
            archive/threat-enrichment-status.json
            archive/radnuc-*.json
            archive/biological-*.json
            archive/chemical-explosives-*.json
            archive/gemini-chinese-map-*.json
            archive/groq-backfill-unlocated.json
            archive/radnuc-v1-seen-*.txt
            archive/biological-v1-seen-*.txt
            archive/chemical-explosives-v1-seen-*.txt
            archive/gemini-chinese-map-v1-seen-*.txt
            quota/groq-oss120b-public-backfill.json
            quota/groq-history-telemetry/
            archive/groq-history-review-cache-v1.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit Biological checkpoints and dedicated Groq quota
        id: checkpoint
        if: always()
        env:
          MAP_BASELINE: ${{ runner.temp }}/groq-backfill-baseline.json
          MAP_UNVALIDATED: ${{ runner.temp }}/groq-backfill-unvalidated.json
          GUARD_BASELINE: ${{ steps.baseline.outcome }}
          GUARD_SPECIALISTS: ${{ steps.specialists.outcome }}
          GUARD_CHINESE: "skipped"
          GUARD_NEW_EVENTS: ${{ steps.new_events.outcome }}
          GUARD_GEO: ${{ steps.geo.outcome }}
          GUARD_QUARANTINE: ${{ steps.quarantine.outcome }}
          GUARD_NEW_COUNT: ${{ steps.new_events.outputs.new_count }}
        run: |
          set -euo pipefail
          python tools/apply_source_faithfulness.py --apply --defer-invalid-map
          # Preserve upstream checkpoints/quota, but never commit an unchecked Map.
          # An incomplete path saves recovery bytes and restores the pre-run Map.
          python tools/backfill_publication_guard.py finalize
          # Mandatory even after an upstream failure: raw replayed anchors
          # must never reach main through the always() checkpoint commit.
          python tools/backfill_record_integrity.py events.json --check
          python tools/repair_weak_incident_ids.py events.json
          python - <<'PY'
          import json
          from pathlib import Path
          db=json.loads(Path("events.json").read_text(encoding="utf-8"))
          if not isinstance(db.get("events"),list) or not db["events"]:
              raise RuntimeError("Refusing to commit corrupt Map database")
          for folder in ("archive","quota"):
              for path in Path(folder).glob("*.json"):
                  json.loads(path.read_text(encoding="utf-8"))
          PY
          python tools/backfill_publication_guard.py verify
          git config user.name "CT Intelligence Map Bot"
          git config user.email "actions@github.com"
          git add -- events.json archive quota
          if git diff --cached --quiet; then
            echo "Nothing to commit (quota exhausted or no new source results)."
            exit 0
          fi
          git commit -m "Checkpoint free Groq historical backfills and preserve source dedup"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Concurrent data conflict. Recovery artifact retained."
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 4))
          done
          exit 1
      - name: Preserve publication receipt and withheld working copy
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: groq-publication-guard-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            archive/groq-publication-guard-status.json
            ${{ runner.temp }}/groq-backfill-unvalidated.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Publish factual coverage not model-marketing claims
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths=[
              "archive/threat-enrichment-status.json",
              "archive/gemini-chinese-map-status.json",
              "quota/groq-oss120b-public-backfill.json",
          ]
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out:
              out.write("## Groq Free public-news historical backfill\n\n")
              for name in paths:
                  f=Path(name)
                  if not f.exists(): continue
                  obj=json.loads(f.read_text(encoding="utf-8"))
                  if name.startswith("quota/"):
                      out.write(f"- Groq UTC-day attempts: {obj.get('requests',0)}/{obj.get('request_cap',32)}; "
                                f"reserved tokens: {obj.get('reserved_tokens',0)}/{obj.get('token_cap',160000)}\n")
                  elif "threat" in name:
                      counts={k:v.get("pending_searches") for k,v in obj.get("categories",{}).items()}
                      out.write(f"- Specialist history pending search units: {counts}\n")
                  else:
                      import backfill_control
                      if not backfill_control.lane_enabled(Path('.'), 'chinese_map'):
                          out.write("- Chinese map history cancelled; saved progress preserved.\n")
                      else:
                          out.write(f"- Eight-category Chinese pending search units: "
                                    f"{obj.get('pending_units_including_split_children','unknown')}\n")
              out.write("\nOnly completed search tasks, actual reviews and accepted "
                        "geo-checked events count; no claim of exhaustive coverage.\n")
          PY

      - name: Refuse deployment when validation was incomplete
        if: always() && steps.checkpoint.outputs.publication_ready != 'true'
        run: |
          echo "::error::Map publication withheld; inspect guard receipt and recovery artifacts."
          exit 1

  deploy:
    needs: backfill
    if: needs.backfill.result == 'success' && needs.backfill.outputs.publication_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - name: Build map payload with existing filters
        uses: ./.github/actions/build-events-lite
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - uses: actions/deploy-pages@v5
        id: deployment
