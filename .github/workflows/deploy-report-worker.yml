name: Deploy CT Atlas report Worker

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/deploy-report-worker.yml"
      - "tools/wrangler_retry.py"
      - "tests/**"
      - "ct-atlas-runtime.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ct-atlas-report-worker
  cancel-in-progress: false

jobs:
  deploy-worker:
    # This job runs the system python3, and ubuntu-latest moves to 26.04 job by job
    # until 2026-11-19: one commit could meet two images.
    runs-on: ubuntu-24.04
    concurrency:
      group: ct-atlas-shared-worker-deployment
      queue: max
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate Worker JavaScript
        run: |
          # `node --check file.js` silently accepts syntax errors in ES modules
          # (exit 0 even for an unterminated string), so parse them as modules.
          for file in cloudflare-worker/*.js; do
            node --input-type=module --check < "$file"
          done
          node --check crypto.js

      - name: Run the Node regression suite
        run: node --test tests/*.test.cjs

      - name: Name the failing Node tests
        # Job logs are not public, annotations are.
        if: failure()
        shell: bash
        run: |
          node --test --test-reporter=tap tests/*.test.cjs > node-suite.txt 2>&1 || true
          summary="$(grep -E -A3 '^ *(not ok|error:)' node-suite.txt | grep -v '^--' | head -n 60 | cut -c1-200 | awk '{printf "%s%%0A", $0}')"
          echo "::error title=Node suite::${summary:-the suite failed but named no test}"

      - name: Run the Python release checks
        run: |
          python3 --version
          python3 tests/quiz_source_test.py
          python3 tests/update_sanctions_test.py
          python3 tests/build_events_lite_test.py
          python3 tests/build_events_map_test.py

      - name: Verify required auth secret
        shell: bash
        run: |
          set -euo pipefail
          secret_list="$(python3 tools/wrangler_retry.py secret list --config cloudflare-worker/wrangler.toml)"
          if ! printf '%s' "$secret_list" | grep -q 'AUTH_USERS_JSON'; then
            echo "::error::Cloudflare secret AUTH_USERS_JSON is missing. Refusing to deploy the Worker."
            exit 1
          fi
          echo "AUTH_USERS_JSON is provisioned in Cloudflare."

      - name: Deploy Worker
        run: python3 tools/wrangler_retry.py deploy --keep-vars --config cloudflare-worker/wrangler.toml
