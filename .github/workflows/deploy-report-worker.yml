name: Deploy CT Atlas report Worker

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/deploy-report-worker.yml"
      - "tests/**"
      - "ct-atlas-runtime.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ct-atlas-report-worker
  cancel-in-progress: true

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Validate Worker JavaScript
        run: |
          node --check cloudflare-worker/shared.js
          node --check cloudflare-worker/report-gate.js
          node --check cloudflare-worker/index.js
          node --check cloudflare-worker/quiz.js
          node --test tests/*.test.cjs
          python3 tests/quiz_source_test.py

      - name: Provision secret-backed auth (when configured)
        env:
          CT_ATLAS_AUTH_USERS_JSON: ${{ secrets.CT_ATLAS_AUTH_USERS_JSON }}
        run: |
          if [ -n "$CT_ATLAS_AUTH_USERS_JSON" ]; then
            printf '%s' "$CT_ATLAS_AUTH_USERS_JSON" | npx wrangler@latest secret put AUTH_USERS_JSON --config cloudflare-worker/wrangler.toml
          else
            echo "::warning::CT_ATLAS_AUTH_USERS_JSON is not configured; Worker remains in legacy authentication compatibility mode."
          fi

      - name: Deploy Worker
        run: npx wrangler@latest deploy --keep-vars --config cloudflare-worker/wrangler.toml
