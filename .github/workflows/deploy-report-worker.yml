name: Deploy CT Atlas report Worker

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/deploy-report-worker.yml"
      - "tests/**"
      - "ct-atlas-runtime.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ct-atlas-report-worker
  cancel-in-progress: true

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Validate Worker JavaScript
        run: |
          node --check cloudflare-worker/shared.js
          node --check cloudflare-worker/report-gate.js
          node --check cloudflare-worker/index.js
          node --check cloudflare-worker/quiz.js
          node --check cloudflare-worker/crypto.js
          node --check cloudflare-worker/crypto-workspace.js
          node --check cloudflare-worker/crypto-monitor.js
          node --check cloudflare-worker/source-preview.js
          node --check cloudflare-worker/social-intel.js
          node --check cloudflare-worker/social-agent-client.js
          node --check crypto.js
          node --test tests/*.test.cjs
          python3 tests/quiz_source_test.py

      - name: Verify required auth secret
        shell: bash
        run: |
          set -euo pipefail
          secret_list="$(npx wrangler@latest secret list --config cloudflare-worker/wrangler.toml)"
          if ! printf '%s' "$secret_list" | grep -q 'AUTH_USERS_JSON'; then
            echo "::error::Cloudflare secret AUTH_USERS_JSON is missing. Refusing to deploy the Worker."
            exit 1
          fi
          echo "AUTH_USERS_JSON is provisioned in Cloudflare."

      - name: Deploy Worker
        run: npx wrangler@latest deploy --keep-vars --config cloudflare-worker/wrangler.toml
