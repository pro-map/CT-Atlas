name: Deploy CT Atlas report Worker

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/deploy-report-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ct-atlas-report-worker
  cancel-in-progress: true

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Validate Worker JavaScript
        run: |
          node --check cloudflare-worker/shared.js
          node --check cloudflare-worker/report-gate.js
          node --check cloudflare-worker/index.js

      - name: Deploy Worker
        run: npx wrangler@latest deploy --config cloudflare-worker/wrangler.toml
