name: Validate CT Atlas collector

on:
  push:
    branches:
      - main
    paths:
      - "collector.py"
      - "radnuc.py"
      - ".github/workflows/validate-collector.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile collector
        run: python -m py_compile collector.py radnuc.py
