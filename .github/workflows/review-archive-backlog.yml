name: Review archive backlog

# Reviews the former map events waiting in archive/recovery-pending-review-*.json
# with the map's Gemini selection (tools/review_pending_archive.py) and commits
# the result: events scoring above 0 go to archive/recovered-events-reviewed-*.json
# (added to the D1 archive by the nightly sync-background-corpus run), the rest
# are dropped. It uses a model whose free quota the collection does not touch
# (Gemini 3.1 Flash Lite, 500 requests/day of its own), and runs before the
# Pacific-day quota reset (09:00 Paris) so it can never delay the 10:17 collection.
on:
  schedule:
    - cron: "5 7 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:
    inputs:
      max_calls:
        description: "Gemini calls this run (25 events each)"
        required: false
        default: "120"

permissions:
  contents: write

concurrency:
  group: ct-atlas-archive-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ARCHIVE_REVIEW_MAX_CALLS: ${{ inputs.max_calls || '120' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Review pending events
        run: python -u tools/review_pending_archive.py

      - name: Commit the reviewed archive files
        run: |
          set -euo pipefail
          git config user.name "CT Intelligence Map Bot"
          git config user.email "actions@github.com"
          git add -A -- 'archive/recovery-pending-review-*.json' 'archive/recovered-events-reviewed-*.json'
          if git diff --cached --quiet; then
            echo "Nothing reviewed; no commit."
            exit 0
          fi
          git commit -m "Review archive backlog with Gemini"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Concurrent modification conflict; the next run will review again."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 4))
          done
          echo "Push failed; the next run will review again."
          exit 1
