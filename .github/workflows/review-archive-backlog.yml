name: Review archive backlog

# Reviews the former map events waiting in archive/recovery-pending-review-*.json
# with the map's Gemini selection (tools/review_pending_archive.py) and commits
# the result: events scoring above 0 go to archive/recovered-events-reviewed-*.json
# (added to the D1 archive by the nightly sync-background-corpus run), the rest
# are dropped. It uses a model whose free quota the collection does not touch
# (Gemini 3.1 Flash Lite, 500 requests/day of its own), at most 120 requests a
# Pacific day (quota/gemini-3.1-archive-review.json). It runs after the archive
# enrichment (02:43) and before the incident consolidation (07:37), so the
# jobs sharing that model never run at once.
on:
  schedule:
    - cron: "13 5 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:
    inputs:
      max_calls:
        description: "Gemini requests this run (25 events each)"
        required: false
        default: "120"

permissions:
  contents: write

concurrency:
  group: ct-atlas-archive-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    # 120 requests of 25 events, 6 s apart plus Gemini's answer time; every
    # batch is saved at once, so a timeout loses nothing.
    timeout-minutes: 100
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ARCHIVE_REVIEW_MAX_CALLS: ${{ inputs.max_calls || '120' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Review pending events
        # Leaves the commit step time to save the batches already reviewed.
        timeout-minutes: 85
        run: python -u tools/review_pending_archive.py

      - name: Commit the reviewed archive files
        if: ${{ always() }}
        run: |
          set -euo pipefail
          git config user.name "CT Intelligence Map Bot"
          git config user.email "actions@github.com"
          # Whole folders (a glob matching no file would stop the step), and
          # only those that exist: quota/ appears with the first request.
          for path in archive quota; do
            if [ -e "$path" ]; then git add -A -- "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing reviewed; no commit."
            exit 0
          fi
          git commit -m "Review archive backlog with Gemini"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Concurrent modification conflict; the next run will review again."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 4))
          done
          echo "Push failed; the next run will review again."
          exit 1
