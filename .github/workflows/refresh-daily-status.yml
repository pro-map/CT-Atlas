name: Refresh daily collection status

on:
  push:
    branches: [main]
    paths:
      - "daily_pipeline.py"
      - "tools/finalize_daily_status.py"
      - ".github/workflows/refresh-daily-status.yml"
  workflow_run:
    # Not "Daily RadNuc background archive": it starts 10 min after the map
    # update's slot and finishes long before it (1-8 min against 60-80), so the
    # refresh after the map update already publishes the new RadNuc row; a late
    # one waits for the next map update. Its own trigger only queued one more
    # member of the shared lock, where a later arrival cancels a pending run.
    workflows: ["Daily CT Intelligence Map Update"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ct-map-update-main
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Rebuilds events.json from data/events/ once the store is the database, or checks
      # that the two agree (docs/STORAGE_MIGRATION.md). Before anything reads it.
      - name: Materialize events.json from the store
        run: python3 events_store.py materialize
      - name: Validate progress publication
        run: python -m unittest discover -s tests -p 'finalize_daily_status_test.py'
      - name: Refresh independent collection progress without AI calls
        run: python tools/finalize_daily_status.py --refresh-existing
      - name: Commit verified progress
        id: commit
        run: |
          set -euo pipefail
          python3 events_store.py stage
          git add -- daily-collection-status.json
          if git diff --cached --quiet; then
            # The refresh keeps finalized_at when nothing else changed.
            echo "Collection status unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "CT Intelligence Map Bot"
          git config user.email "actions@github.com"
          # GitHub refuses files over 100 MiB: say so before the push fails.
          python3 tools/check_committed_sizes.py
          git commit -m "Refresh visible daily and RadNuc processing status"
          if ! bash tools/push_data_commit.sh; then
            echo "Status push failed; the next refresh rebuilds it."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Decide whether GitHub Pages needs this refresh
        id: publish
        env:
          CHANGED: ${{ steps.commit.outputs.changed }}
          EVENT: ${{ github.event_name }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          # An unchanged status is already published: redeploying it would only
          # add a Pages and a mirror deploy. A manual run, and the run after a map
          # update that did not succeed (its own deploy may be missing), still
          # republish main as a safety net.
          if [ "$CHANGED" = "true" ] || [ "$EVENT" = "workflow_dispatch" ] ||
             { [ "$EVENT" = "workflow_run" ] && [ "$TRIGGER_CONCLUSION" != "success" ]; }; then
            echo "pages=true" >> "$GITHUB_OUTPUT"
          else
            echo "GitHub Pages keeps its current publication."
          fi
      - name: Configure GitHub Pages
        if: steps.publish.outputs.pages == 'true'
        uses: actions/configure-pages@v6
      - name: Build active map and Database data
        if: steps.publish.outputs.pages == 'true'
        uses: ./.github/actions/build-events-lite
      - name: Upload website
        if: steps.publish.outputs.pages == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: "."
      - name: Deploy GitHub Pages
        id: deployment
        if: steps.publish.outputs.pages == 'true'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify the data actually served by GitHub Pages
        if: steps.publish.outputs.pages == 'true'
        run: python3 tools/daily_publication_audit.py verify --url "${{ steps.deployment.outputs.page_url }}" --expected publication-manifest.json --output publication-receipt-pages.json
      - name: Retain Pages publication proof
        if: ${{ always() && steps.publish.outputs.pages == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: status-publication-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            publication-manifest.json
            publication-receipt-pages.json
          retention-days: 7
          if-no-files-found: ignore
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
