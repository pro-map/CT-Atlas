name: Apply CT Atlas usage upgrade

# One-off migration: index.html has carried usage-admin.js since 2026-09-05, so
# the patch step is a no-op. Manual only: on every UI push it redeployed Pages
# a second time, without the served-data verification, and triggered one more
# mirror deploy. deploy-current-ct-atlas-ui.yml publishes the UI.
on:
  workflow_dispatch:

permissions:
  contents: write

# Same group as the collector: its index.html commit never races a data write.
# queue:max is required on every member; the default replaces pending repairs.
concurrency:
  group: ct-map-update-main
  cancel-in-progress: false
  queue: max

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Apply usage/admin patch to index.html
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'usage-admin.js' index.html; then
            echo "Usage/admin patch is already present in index.html."
          else
            git apply --ignore-space-change --whitespace=nowarn tools/usage_upgrade.patch
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          text = p.read_text(encoding="utf-8")
          normalized = text.replace("\r\n", "\n").replace("\r", "\n")
          p.write_bytes(normalized.replace("\n", "\r\n").encode("utf-8"))
          PY
          grep -q 'isAdmin' usage-admin.js
          grep -q 'usage-admin.js' index.html
          grep -q 'usage-auth-fix.js' index.html
          grep -q 'usage-admin.css' index.html

      - name: Validate JavaScript
        run: |
          node --check usage-admin.js
          node --check usage-auth-fix.js
          node --check deep-search.js
          node --check crypto.js
          node --check crypto-launcher.js
          node --check cloudflare-worker/crypto.js
          node --check cloudflare-worker/crypto-workspace.js
          node --check cloudflare-worker/crypto-monitor.js
          node --check cloudflare-worker/sanctions.js
          node --test tests/crypto.test.cjs tests/crypto-workspace.test.cjs tests/crypto-monitor.test.cjs tests/sanctions.test.cjs
          node --check cloudflare-worker/shared.js
          node --check cloudflare-worker/report-gate.js
          node --check cloudflare-worker/deep-search.js
          node --check cloudflare-worker/index.js

      # No Pages deploy: with the patch applied, a commit here only changes
      # line endings, which the next UI or data deploy publishes.
      - name: Commit upgraded index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CT Atlas Upgrade Bot"
          git config user.email "actions@github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index.html changes to commit."
            exit 0
          fi
          git commit -m "Add usage analytics and report cooldown UI"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "index.html changed on main meanwhile; run this again." >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 4))
          done
          echo "Push failed after 3 attempts." >&2
          exit 1
