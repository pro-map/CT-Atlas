name: Backfill recovery review
on:
  push:
    branches: [fix/backfill-recovery-20261009]
    paths: [.github/workflows/backfill-recovery-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Archive tracked source
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/backfill-recovery-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v6
        with:
          name: backfill-recovery-source
          path: ${{ runner.temp }}/backfill-recovery-source.tar.gz
          retention-days: 1
