name: Backfill recovery review
on:
  push:
    branches: [fix/backfill-recovery-20261009]
    paths: [.github/workflows/backfill-recovery-review.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/backfill-recovery-20261009
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Apply hash-verified reviewed source changes
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, subprocess
          from pathlib import Path
          encoded = ''.join(Path(f'tools/backfill-review-part-{i}.txt').read_text().strip() for i in range(3))
          # Correct a known single-character transcription error in the transport.
          # Only the exact reviewed patch hash below is permitted to execute.
          encoded = encoded.replace('Ex9pFh8dHqK5CZV', 'Ex9pFh8dHqk5CZV')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'a9f1edf7f27e3f2e6c4be8a71e9c225944955b60b13f414a8de01ee614f065ff', 'Patch integrity mismatch'
          assert b'b/.github/' not in patch, 'Workflow changes require the repository connection'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
      - name: Install test dependencies
        run: pip install -r requirements.txt -r darkweb-collector/requirements.txt pytest
      - name: Full Python regression suite
        run: python -m pytest tests/ -q --ignore=tests/visual_intel_detector_test.py
      - name: Full JavaScript regression suite
        run: node --test tests/*.test.cjs
      - name: Commit tested source to isolated review branch
        run: |
          set -euo pipefail
          git rm tools/backfill-review-part-*.txt
          if git diff --cached --name-only | grep -q '^.github/'; then
            echo 'Refusing workflow changes through the runner token'; exit 1
          fi
          git -c core.whitespace=cr-at-eol diff --cached --check
          git config user.name 'CT Atlas Backfill Review'
          git config user.email 'actions@github.com'
          git commit -m 'Repair provider queries, review priority and complete interruption-safe backfill status'
          git push origin HEAD:fix/backfill-recovery-20261009
