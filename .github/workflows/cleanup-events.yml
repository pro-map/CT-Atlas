name: Clean up existing events database

# Manual only. The daily schedule re-checked the map's 60-69 events from
# 2026-09-29 until the backlog was cleared (2026-10-01). It was removed on
# 2026-10-04: a kept event stays at 60-69, so every scheduled run re-checked
# the same events again, and Gemini's run-to-run variation removed some that
# earlier runs had kept (124 on 2026-10-02, 55 on 2026-10-03), on the
# 3.5 Flash Lite quota the interactive features need.
on:
  workflow_dispatch:
    inputs:
      rescore_min:
        description: "Re-check events with this AI relevance score and above"
        required: true
        default: "60"
        type: string
      rescore_max:
        description: "...up to this AI relevance score"
        required: true
        default: "69"
        type: string
      max_batches:
        description: "Max Gemini batches this run (spread a large re-check across several days)"
        required: true
        default: "15"
        type: string
      skip_rescore:
        description: "Only run the free keyword pass (no Gemini calls)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

# Shares the daily collector's commit lock: both write to events.json and push to main.
concurrency:
  group: ct-map-update-main
  cancel-in-progress: false
  queue: max

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RESCORE_MIN: ${{ github.event_name == 'workflow_dispatch' && inputs.rescore_min || '60' }}
      RESCORE_MAX: ${{ github.event_name == 'workflow_dispatch' && inputs.rescore_max || '69' }}
      MAX_BATCHES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_batches || '15' }}
      SKIP_RESCORE: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_rescore || false }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Rebuilds events.json from data/events/ once the store is the database, or checks
      # that the two agree (docs/STORAGE_MIGRATION.md). Before anything reads it.
      - name: Materialize events.json from the store
        run: python3 events_store.py materialize

      - name: Run cleanup
        id: cleanup
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [ "$SKIP_RESCORE" = "true" ]; then
            python -u tools/cleanup_existing_events.py --skip-rescore --show 100
          else
            if [ -z "$GEMINI_API_KEY" ]; then
              echo "GEMINI_API_KEY GitHub secret is missing."
              exit 1
            fi
            python -u tools/cleanup_existing_events.py \
              --rescore-min "$RESCORE_MIN" \
              --rescore-max "$RESCORE_MAX" \
              --max-batches "$MAX_BATCHES" \
              --show 100
          fi

      - name: Commit and push if anything was removed
        # A cleanup removes records on purpose: stage lets the database shrink.
        env:
          ALLOW_SHRINK: "1"
        run: |
          set -euo pipefail
          git config user.name "CT Intelligence Map Bot"
          git config user.email "actions@github.com"
          python3 events_store.py stage
          git add archive/
          if git diff --cached --quiet; then
            echo "Nothing removed; no commit needed."
            exit 0
          fi
          # GitHub refuses files over 100 MiB: say so before the push fails.
          python3 tools/check_committed_sizes.py
          git commit -m "Retroactive cleanup: remove non-operational events (rescore $RESCORE_MIN-$RESCORE_MAX)"
          if ! bash tools/push_data_commit.sh; then
            echo "Push failed; re-run this workflow."
            exit 1
          fi

  # A cleanup is the shrink the publication gate exists to question, and only this
  # run knows it is deliberate: left to the next daily run, a large one would block it.
  # Runs even when nothing was removed, so a failed deploy can be retried from here.
  deploy:
    needs: cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      ALLOW_SHRINK: "1"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout updated main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Build active map and Database data
        uses: ./.github/actions/build-events-lite
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: "."
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify the data actually served by GitHub Pages
        run: python3 tools/daily_publication_audit.py verify --url "${{ steps.deployment.outputs.page_url }}" --expected publication-manifest.json --output publication-receipt-pages.json
