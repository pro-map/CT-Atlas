name: Refresh OFAC sanctions list

# The Worker screens crypto analyses against sanctions-crypto.json as ct-atlas.com
# serves it. OFAC usually publishes in the US afternoon (19:33 UTC on 2026-11-06),
# after the map update's morning slot, which was the only refresh until then.
# This is the only writer of that file. An unchanged list is not downloaded
# (tools/update_sanctions.py compares OFAC's Last-Modified) and not committed.
on:
  schedule:
    - cron: "23 3,9,15,18,20,22 * * *"
  workflow_dispatch:

permissions:
  contents: read

# The data-update lock: a collection commit or another workflow's Pages deploy
# never runs in between this commit and its deploy, and so cannot republish the
# previous list over it.
concurrency:
  group: ct-map-update-main
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      data_sha: ${{ steps.commit.outputs.data_sha }}
      pages: ${{ steps.publish.outputs.pages }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate the updater
        run: |
          if ! python -m unittest discover -s tests -p 'update_sanctions_test.py'; then
            echo "::error title=OFAC refresh failed::The updater's own tests fail on main; the list was not refreshed."
            exit 1
          fi
      - name: Refresh the OFAC list
        run: |
          if ! python -u tools/update_sanctions.py 2> "$RUNNER_TEMP/sanctions-stderr.txt"; then
            cat "$RUNNER_TEMP/sanctions-stderr.txt" >&2
            reason="$(tail -n 1 "$RUNNER_TEMP/sanctions-stderr.txt")"
            echo "::error title=OFAC refresh failed::${reason:-tools/update_sanctions.py failed without saying why}"
            exit 1
          fi
          cat "$RUNNER_TEMP/sanctions-stderr.txt" >&2
      - name: Commit the new list
        id: commit
        run: |
          set -euo pipefail
          git add -- sanctions-crypto.json
          if git diff --cached --quiet; then
            echo "The OFAC list is unchanged; nothing to commit."
            echo "data_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "CT Intelligence Map Bot"
          git config user.email "actions@github.com"
          git commit -m "Refresh OFAC sanctioned crypto addresses"
          for attempt in 1 2 3 4 5; do
            if git fetch origin main; then
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error title=OFAC list not published::The new list does not rebase onto main; the next run downloads it again."
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                echo "data_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep $((attempt * 4))
          done
          echo "::error title=OFAC list not published::Pushing the new list to main failed five times; the next run downloads it again."
          exit 1
      - name: Decide whether GitHub Pages needs the list
        id: publish
        env:
          CHANGED: ${{ steps.commit.outputs.changed }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$CHANGED" = "true" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            echo "pages=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A run whose deploy failed leaves its list on main, where the next run
          # finds it unchanged while ct-atlas.com still serves the previous one.
          # A list that cannot be fetched counts as another one.
          committed="$(sha256sum < sanctions-crypto.json | cut -d ' ' -f 1)"
          served="$(curl --fail --silent --max-time 60 "https://ct-atlas.com/sanctions-crypto.json?integrity=$(date +%s%N)" | sha256sum | cut -d ' ' -f 1)"
          if [ "$served" != "$committed" ]; then
            echo "ct-atlas.com does not serve main's list; publishing it."
            echo "pages=true" >> "$GITHUB_OUTPUT"
          else
            echo "ct-atlas.com already serves this list."
          fi

  deploy:
    needs: refresh
    if: ${{ needs.refresh.outputs.pages == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the committed list
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.refresh.outputs.data_sha }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Build active map and Database data
        uses: ./.github/actions/build-events-lite
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          # deploy-pages rejects multiple matching artifacts from prior attempts.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: "."
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify the list actually served by GitHub Pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          committed="$(sha256sum < sanctions-crypto.json | cut -d ' ' -f 1)"
          for attempt in 1 2 3 4 5; do
            served="$(curl --fail --silent --max-time 60 "${PAGE_URL%/}/sanctions-crypto.json?integrity=$(date +%s%N)" | sha256sum | cut -d ' ' -f 1)"
            if [ "$served" = "$committed" ]; then
              echo "GitHub Pages serves the committed list."
              exit 0
            fi
            sleep $((attempt * 8))
          done
          echo "::error title=OFAC list not published::GitHub Pages does not serve the committed sanctions-crypto.json."
          exit 1
      - name: Verify the data actually served by GitHub Pages
        run: python3 tools/daily_publication_audit.py verify --url "${{ steps.deployment.outputs.page_url }}" --expected publication-manifest.json --output publication-receipt-pages.json
      - name: Retain Pages publication proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sanctions-publication-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            publication-manifest.json
            publication-receipt-pages.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Name the failed publication
        if: failure()
        run: echo "::error title=OFAC list not published::The deploy failed, so ct-atlas.com may still serve the previous list; the next run sees that and deploys again."
