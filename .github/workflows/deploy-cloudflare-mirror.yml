name: Deploy Cloudflare Mirror

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "*.svg"
      - "*.png"
      - "*.json"
      - "tools/deploy_mirror.sh"
      - "tools/compact_mirror_json.py"
      - "tools/build_events_lite.py"
      - "tools/build_events_map.py"
      - "tools/wrangler_retry.py"
      - ".github/workflows/deploy-cloudflare-mirror.yml"
  workflow_dispatch:
  workflow_run:
    # Data commits use GITHUB_TOKEN; publish only after a successful trusted run.
    workflows: ["Daily CT Intelligence Map Update", "Retire Judicial collection", "Refresh daily collection status", "Apply CT Atlas usage upgrade", "Deploy current CT Atlas UI", "Enrich RADNUC — six months, all collection languages", "Enrich specialist categories", "Gemini Chinese eight-category historical backfill", "Groq Free - six-month CBRNE and Chinese historical backfill", "Groq Free - six-month Biological historical backfill", "Groq Free - Biological historical backfill (cancelled)", "Reconcile daily dataset integrity", "Apply reviewed map evidence corrections"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ct-atlas-cloudflare-mirror
  cancel-in-progress: false

jobs:
  deploy-mirror:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare configuration
        id: cloudflare
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare mirror deployment skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions repository secrets."
            exit 1
          fi

      - name: Checkout the exact main revision
        if: steps.cloudflare.outputs.configured == 'true'
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Deploy identical static mirror
        if: steps.cloudflare.outputs.configured == 'true'
        run: bash tools/deploy_mirror.sh
      - name: Verify the data actually served by the mirror
        if: steps.cloudflare.outputs.configured == 'true'
        run: python3 tools/daily_publication_audit.py verify --url "https://ct-atlas-mirror.fairpeace.workers.dev" --expected _pages_mirror/publication-manifest.json --output publication-receipt-mirror.json
      - name: Retain mirror publication proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mirror-publication-proof-${{ github.run_id }}
          path: |
            _pages_mirror/publication-manifest.json
            publication-receipt-mirror.json
          retention-days: 7
          if-no-files-found: ignore
