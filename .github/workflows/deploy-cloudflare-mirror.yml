name: Deploy Cloudflare Mirror

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "*.svg"
      - "*.png"
      - "*.json"
      - "tools/deploy_mirror.sh"
      - "tools/compact_mirror_json.py"
      - "tools/build_events_lite.py"
      - "tools/build_events_map.py"
      - "tools/wrangler_retry.py"
      - ".github/workflows/deploy-cloudflare-mirror.yml"
  workflow_dispatch:
  workflow_run:
    # Groq commits use GITHUB_TOKEN and do not trigger ordinary push workflows.
    # Publish the post-backfill main data only after a successful trusted run.
    workflows: ["Daily CT Intelligence Map Update", "Retire Judicial collection", "Refresh daily collection status", "Daily CT Atlas Quiz", "Apply CT Atlas usage upgrade", "Deploy current CT Atlas UI", "Enrich RADNUC — six months, all collection languages", "Enrich specialist categories", "Gemini Chinese eight-category historical backfill", "Groq Free - six-month CBRNE and Chinese historical backfill"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ct-atlas-cloudflare-mirror
  cancel-in-progress: false

jobs:
  deploy-mirror:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare configuration
        id: cloudflare
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare mirror deployment skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions repository secrets."
            exit 1
          fi

      - name: Checkout the exact main revision
        if: steps.cloudflare.outputs.configured == 'true'
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Deploy identical static mirror
        if: steps.cloudflare.outputs.configured == 'true'
        run: bash tools/deploy_mirror.sh



