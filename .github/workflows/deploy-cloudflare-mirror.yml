name: Deploy Cloudflare Mirror

on:
  push:
    branches:
      - main
    # No site files but the database: a UI push deploys through "Deploy current
    # CT Atlas UI", which runs the test suite first, and the mirror follows its
    # success below. (tests/publication_workflows_test.py checks that one of the
    # two watches every staged file.)
    paths:
      - "events.json"
      - "data/events/**"
      - "events_store.py"
      - "tools/deploy_mirror.sh"
      - "tools/compact_mirror_json.py"
      - "tools/mirror-worker.mjs"
      - "tools/daily_publication_audit.py"
      - "daily_reliability.py"
      - "retired_categories.py"
      - "attack_points.py"
      - "tools/build_events_lite.py"
      - "tools/build_events_map.py"
      - "tools/wrangler_retry.py"
      - ".github/workflows/deploy-cloudflare-mirror.yml"
  workflow_dispatch:
  workflow_run:
    # Data commits use GITHUB_TOKEN; publish only after a successful trusted run.
    # Exactly the name: of every workflow that deploys GitHub Pages, but "Refresh
    # OFAC sanctions list": it commits only sanctions-crypto.json, which the mirror
    # does not stage (the Worker reads it from ct-atlas.com), so following it only
    # redeployed identical files (tests/publication_workflows_test.py keeps this
    # list complete and current).
    workflows:
      - "Daily CT Intelligence Map Update"
      - "Refresh daily collection status"
      - "Deploy current CT Atlas UI"
      - "Reconcile daily dataset integrity"
      - "Apply reviewed map evidence corrections"
      - "Retire Judicial collection"
      - "Clean up existing events database"
      - "Actualiser le logo uniquement"
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ct-atlas-cloudflare-mirror
  cancel-in-progress: false

jobs:
  deploy-mirror:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare configuration
        id: cloudflare
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare mirror deployment skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions repository secrets."
            exit 1
          fi

      - name: Checkout the exact main revision
        if: steps.cloudflare.outputs.configured == 'true'
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Skip a revision the mirror already serves
        id: current
        if: steps.cloudflare.outputs.configured == 'true' && github.event_name == 'workflow_run'
        shell: bash
        run: |
          # A status refresh that committed nothing leaves main where it was, so its
          # completion (like any repeated trigger) has nothing new to mirror. The
          # mirror's own manifest names the revision it was built from; when that is
          # unknown or another revision, deploy, so a pending run that a newer
          # trigger replaced is still mirrored. Manual runs always redeploy.
          served="$(python3 tools/daily_publication_audit.py served-revision --url "https://ct-atlas-mirror.fairpeace.workers.dev")"
          if [ -n "$served" ] && [ "$served" = "$(git rev-parse HEAD)" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "The mirror already serves main at $served; nothing to redeploy."
          fi

      - name: Deploy identical static mirror
        if: steps.cloudflare.outputs.configured == 'true' && steps.current.outputs.skip != 'true'
        run: bash tools/deploy_mirror.sh
      - name: Verify the data actually served by the mirror
        if: steps.cloudflare.outputs.configured == 'true' && steps.current.outputs.skip != 'true'
        run: python3 tools/daily_publication_audit.py verify --url "https://ct-atlas-mirror.fairpeace.workers.dev" --expected _pages_mirror/publication-manifest.json --output publication-receipt-mirror.json
      - name: Retain mirror publication proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mirror-publication-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _pages_mirror/publication-manifest.json
            publication-receipt-mirror.json
          retention-days: 7
          if-no-files-found: ignore
