name: Deploy SOCMINT ADK agent

on:
  push:
    branches:
      - main
    paths:
      - "socmint-agent/**"
      - ".github/workflows/deploy-socmint-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ct-atlas-socmint-agent
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ct-atlas
      GCP_REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
      SERVICE_NAME: ct-atlas-socmint-agent
      ARTIFACT_REPOSITORY: ct-atlas-agents
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify required deployment secrets
        shell: bash
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for item in GCP_SA_KEY GEMINI_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!item:-}" ]; then
              echo "::error::Required GitHub secret $item is missing."
              missing=1
            fi
          done
          exit "$missing"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ct-atlas

      - name: Enable required Google Cloud APIs
        run: |
          gcloud services enable run.googleapis.com artifactregistry.googleapis.com

      - name: Prepare Artifact Registry
        shell: bash
        run: |
          set -euo pipefail
          if ! gcloud artifacts repositories describe "$ARTIFACT_REPOSITORY" \
            --project "$GCP_PROJECT_ID" \
            --location "$GCP_REGION" >/dev/null 2>&1; then
            gcloud artifacts repositories create "$ARTIFACT_REPOSITORY" \
              --project "$GCP_PROJECT_ID" \
              --location "$GCP_REGION" \
              --repository-format docker \
              --description "CT Atlas agent containers" \
              --quiet
          fi
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      - name: Generate agent bridge secret
        shell: bash
        run: |
          set -euo pipefail
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "AGENT_SHARED_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Build and push SOCMINT agent image
        shell: bash
        run: |
          set -euo pipefail
          image_uri="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$SERVICE_NAME:$GITHUB_SHA"
          docker build -t "$image_uri" ./socmint-agent
          docker push "$image_uri"
          echo "SOCMINT_IMAGE_URI=$image_uri" >> "$GITHUB_ENV"

      - name: Deploy ADK agent to Cloud Run
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_AI_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_AI_ACCOUNT_ID }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
        run: |
          set -euo pipefail

          search_provider="disabled"
          if [ -n "${BRAVE_SEARCH_API_KEY:-}" ]; then
            search_provider="brave"
          fi

          gcloud run deploy "$SERVICE_NAME" \
            --image "$SOCMINT_IMAGE_URI" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --quiet \
            --set-env-vars "SOCMINT_AGENT_MODEL=gemini-3.5-flash-lite,SOCMINT_SEARCH_PROVIDER=$search_provider,GEMINI_API_KEY=$GEMINI_API_KEY,CT_ATLAS_AGENT_SHARED_SECRET=$AGENT_SHARED_SECRET,BRAVE_SEARCH_API_KEY=$BRAVE_SEARCH_API_KEY,YOUTUBE_API_KEY=$YOUTUBE_API_KEY,REDDIT_CLIENT_ID=$REDDIT_CLIENT_ID,REDDIT_CLIENT_SECRET=$REDDIT_CLIENT_SECRET,GROQ_API_KEY=$GROQ_API_KEY,GROQ_WHISPER_MODEL=whisper-large-v3-turbo,OPENROUTER_API_KEY=$OPENROUTER_API_KEY,OPENROUTER_FREE_MODEL=openrouter/free,CLOUDFLARE_AI_ACCOUNT_ID=$CLOUDFLARE_AI_ACCOUNT_ID,CLOUDFLARE_AI_API_TOKEN=$CLOUDFLARE_AI_API_TOKEN,CLOUDFLARE_AI_MODEL=@cf/meta/llama-3.1-8b-instruct"

          service_url="$(gcloud run services describe "$SERVICE_NAME" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='value(status.url)')"

          test -n "$service_url"
          echo "SOCMINT_AGENT_URL=$service_url" >> "$GITHUB_ENV"
          echo "SOCMINT agent deployed."

      - name: Verify agent health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$SOCMINT_AGENT_URL/health" | python -m json.tool

      - name: Verify agent investigation
        shell: bash
        run: |
          set -euo pipefail
          payload='{"user_id":"ct_atlas_smoke","query":{"mode":"urls_only","target":"CT Atlas SOCMINT smoke test","usernames":[],"keywords":[],"platforms":[],"urls":["https://example.com/"],"countries_regions":[],"languages":["English"],"date_from":"","date_to":"","objective":"Fetch the supplied public page and return a minimal evidence-led SOCMINT report. Do not infer identity or wrongdoing."}}'
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --max-time 110 \
            -X POST "$SOCMINT_AGENT_URL/investigate" \
            -H "Content-Type: application/json" \
            -H "X-CT-Atlas-Agent-Key: $AGENT_SHARED_SECRET" \
            --data "$payload")"
          cat "$response_file" | python -m json.tool || cat "$response_file"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::SOCMINT /investigate smoke test failed with HTTP $status"
            exit 1
          fi
          python - "$response_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              data=json.load(fh)
          assert data.get("ok") is True
          assert isinstance(data.get("report"), dict)
          assert data["report"].get("executive_assessment")
          print("SOCMINT /investigate smoke test passed.")
          PY

      - name: Configure CT Atlas Worker bridge
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SOCMINT_AGENT_URL" | npx wrangler@latest secret put SOCMINT_AGENT_URL --config cloudflare-worker/wrangler.toml
          printf '%s' "$AGENT_SHARED_SECRET" | npx wrangler@latest secret put SOCMINT_AGENT_SHARED_SECRET --config cloudflare-worker/wrangler.toml

      - name: Deploy CT Atlas Worker with ADK bridge
        run: npx wrangler@latest deploy --keep-vars --config cloudflare-worker/wrangler.toml

      - name: Verify Worker reports ADK agent configured
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error https://ct-report-generator.fairpeace.workers.dev/health)"
          printf '%s\n' "$health" | python -m json.tool
          printf '%s' "$health" | grep -q '"social_agent_configured":true'
          echo "SOCMINT ADK agent is active in CT Atlas."
