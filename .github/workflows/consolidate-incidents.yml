name: Consolidate duplicate incidents
# cloudflare-worker/schedule-dispatcher.js recognises a started slot by this title.
run-name: ${{ inputs.slot && format('Slot {0}', inputs.slot) || github.workflow }}

# Retroactive pass over the 180-day database (tools/consolidate_incidents.py):
# Gemini groups incident ids that are the same real-world incident, duplicate
# records are folded. Progress lives in incident_consolidation_state.json, so
# each run continues the backlog; once it is drained a scheduled run only
# reviews the few windows the daily collector has not already handled.
#
# Quota: it runs on Gemini 3.1 Flash Lite (its own 500 requests/day), not the
# 3.5 Flash Lite the collection and the interactive features use, and stays
# at 40 requests a run and 120 a Pacific day (tools/archive_review.py's
# ledger, quota/gemini-3.1-consolidation.json), so 3.1 Flash Lite keeps room for the archive
# review, the enrichment and the Report Generator/Deep Search/Atlas AI fallback.
on:
  schedule:
    # Once a day: the backlog was drained in October and the collector
    # consolidates its own new incidents every run. GitHub starts scheduled
    # runs hours late, so the old midday and afternoon slots landed inside the
    # delayed map updates and held their shared lock.
    - cron: "37 7 * * *"
      timezone: "Europe/Paris"
  # A new consolidation rule re-opens refused incidents: review them at once.
  push:
    branches: [main]
    paths:
      - "tools/consolidate_incidents.py"
      - ".github/workflows/consolidate-incidents.yml"
  workflow_dispatch:
    inputs:
      max_calls:
        description: "Max Gemini window reviews this run"
        required: true
        default: "40"
        type: string
      slot:
        description: "Timed slot this run stands for, sent by the dispatcher; empty for a manual run"
        required: false
        default: ""
        type: string

permissions:
  contents: write

# Shares the daily collector's commit lock: both rewrite events.json.
concurrency:
  group: ct-map-update-main
  cancel-in-progress: false
  queue: max

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAX_CALLS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_calls || '40' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Consolidate incidents
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_SELECTION_MODEL: "gemini-3.1-flash-lite"
        run: |
          set -euo pipefail
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY GitHub secret is missing."
            exit 1
          fi
          python -u tools/consolidate_incidents.py --max-calls "$MAX_CALLS"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "CT Intelligence Map Bot"
          git config user.email "actions@github.com"
          git add events.json incident_consolidation_state.json
          # This Pacific day's Gemini requests (the job's daily allocation).
          if [ -f quota/gemini-3.1-consolidation.json ]; then git add quota/gemini-3.1-consolidation.json; fi
          if git diff --cached --quiet; then
            echo "Nothing consolidated; no commit needed."
            exit 0
          fi
          # GitHub refuses files over 100 MiB: say so before the push fails.
          python3 tools/check_committed_sizes.py
          git commit -m "Consolidate duplicate incidents"
          if ! bash tools/push_data_commit.sh; then
            echo "Push failed; the next run continues from the saved state."
            exit 1
          fi
