name: Bootstrap CT Atlas authentication secret

on:
  push:
    branches:
      - main
    paths:
      - "tools/auth-users-bootstrap.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ct-atlas-report-worker
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Validate the complete account roster
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          node <<'NODE'
          const fs = require("node:fs");
          const users = JSON.parse(fs.readFileSync("tools/auth-users-bootstrap.json", "utf8"));
          const expected = [
            "admin",
            ...Array.from({ length: 10 }, (_, i) => "group-i-" + (i + 1)),
            ...Array.from({ length: 10 }, (_, i) => "group-p-" + (i + 1)),
            ...Array.from({ length: 10 }, (_, i) => "group-s-" + (i + 1))
          ].sort();
          const actual = Object.keys(users).sort();
          if (actual.length !== expected.length || actual.some((value, i) => value !== expected[i])) {
            throw new Error("The bootstrap roster is incomplete or contains unexpected users.");
          }
          for (const [username, hash] of Object.entries(users)) {
            if (!/^[a-z0-9][a-z0-9._-]{0,63}$/.test(username) || !/^[a-f0-9]{64}$/.test(hash)) {
              throw new Error("Invalid username or SHA-256 password hash.");
            }
          }
          console.log("Validated " + actual.length + " users.");
          NODE

      - name: Provision AUTH_USERS_JSON in Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@latest secret put AUTH_USERS_JSON --config cloudflare-worker/wrangler.toml < tools/auth-users-bootstrap.json

      - name: Remove the bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/auth-users-bootstrap.json .github/workflows/bootstrap-auth-secret.yml
          git config user.name "CT Atlas Auth Bootstrap Bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --check
          git commit -m "Provision authentication roster as Cloudflare secret"
          git push origin HEAD:main
