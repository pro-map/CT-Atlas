name: Deploy Facial Intelligence service

on:
  push:
    branches:
      - main
    paths:
      - "visual-intel-service/**"
      - "cloudflare-worker/visual-intel.js"
      - "cloudflare-worker/index.js"
      - ".github/workflows/deploy-visual-intel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ct-atlas-visual-intel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ct-atlas
      GCP_REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
      SERVICE_NAME: ct-atlas-visual-intel
      ARTIFACT_REPOSITORY: ct-atlas-agents
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v6

      - name: Verify deployment secrets
        shell: bash
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          for item in GCP_SA_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!item:-}" ] || { echo "::error::Missing $item"; exit 1; }
          done

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ct-atlas

      - name: Prepare Google Cloud
        run: |
          gcloud services enable run.googleapis.com artifactregistry.googleapis.com
          if ! gcloud artifacts repositories describe "$ARTIFACT_REPOSITORY" --project "$GCP_PROJECT_ID" --location "$GCP_REGION" >/dev/null 2>&1; then
            gcloud artifacts repositories create "$ARTIFACT_REPOSITORY" --project "$GCP_PROJECT_ID" --location "$GCP_REGION" --repository-format docker --quiet
          fi
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      - name: Generate visual bridge secret
        shell: bash
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "VISUAL_SHARED_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          image_uri="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$SERVICE_NAME:$GITHUB_SHA"
          docker build -t "$image_uri" ./visual-intel-service
          docker push "$image_uri"
          echo "VISUAL_IMAGE_URI=$image_uri" >> "$GITHUB_ENV"

      - name: Deploy visual service
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE_NAME" \
            --image "$VISUAL_IMAGE_URI" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --timeout 180 \
            --quiet \
            --set-env-vars "CT_ATLAS_VISUAL_SHARED_SECRET=$VISUAL_SHARED_SECRET"
          service_url="$(gcloud run services describe "$SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          test -n "$service_url"
          echo "VISUAL_INTEL_URL=$service_url" >> "$GITHUB_ENV"

      - name: Verify health
        run: curl --fail --silent --show-error "$VISUAL_INTEL_URL/health" | python -m json.tool

      - name: Configure Worker bridge
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$VISUAL_INTEL_URL" | npx wrangler@latest secret put VISUAL_INTEL_URL --config cloudflare-worker/wrangler.toml
          printf '%s' "$VISUAL_SHARED_SECRET" | npx wrangler@latest secret put VISUAL_INTEL_SHARED_SECRET --config cloudflare-worker/wrangler.toml

      - name: Smoke test image analysis
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          data=base64.b64decode("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=")
          open("/tmp/tiny.png","wb").write(data)
          PY
          curl --fail --silent --show-error --max-time 60 \
            -X POST "$VISUAL_INTEL_URL/analyze" \
            -H "X-CT-Atlas-Visual-Key: $VISUAL_SHARED_SECRET" \
            -F "files=@/tmp/tiny.png;type=image/png" > /tmp/visual.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/visual.json"))
          assert data.get("ok") is True
          assert data.get("analysis_scope",{}).get("identity_recognition") is False
          assert data.get("analysis_scope",{}).get("biometric_embeddings") is False
          print("Facial Intelligence smoke test passed.")
          PY

      - name: Deploy CT Atlas Worker bridge
        run: npx wrangler@latest deploy --keep-vars --config cloudflare-worker/wrangler.toml

      - name: Verify Worker bridge
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error https://ct-report-generator.fairpeace.workers.dev/health)"
          printf '%s' "$health" | grep -q '"visual_intel_configured":true'
          echo "Facial Intelligence bridge is active."
