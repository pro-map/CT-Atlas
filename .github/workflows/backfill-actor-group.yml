name: Backfill actor/group field (existing events)

on:
  workflow_dispatch:
    inputs:
      window_days:
        description: "How far back (days) to re-check events missing actor_group"
        required: true
        default: "180"
      max_calls:
        description: "Safety cap on Gemini calls this run (re-run to continue if reached)"
        required: true
        default: "400"

permissions:
  contents: write
  pages: write
  id-token: write

# Shared with the daily collector and other one-off backfills to serialize
# writes to events.json and Pages deployments.
concurrency:
  group: ct-map-update-main
  cancel-in-progress: false

jobs:
  recategorize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RECAT_WINDOW_DAYS: ${{ inputs.window_days }}
      RECAT_MAX_CALLS: ${{ inputs.max_calls }}
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract actor_group on existing events
        id: recategorize
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY GitHub secret is missing."
            exit 1
          fi
          python -u tools/backfill_actor_group.py

      - name: Preserve recovery artifact even if a previous step failed
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: ct-actor-group-backfill-${{ github.run_id }}-${{ github.run_attempt }}
          path: events.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit database safely
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.recategorize.outcome == 'success' }}
        run: |
          set -euo pipefail
          git config user.name "CT Intelligence Map Bot"
          git config user.email "actions@github.com"
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          db = json.loads(Path("events.json").read_text(encoding="utf-8"))
          if not isinstance(db, dict) or not isinstance(db.get("events"), list):
              raise RuntimeError("Invalid database checkpoint; recovery artifact retained")
          subprocess.run(["git", "add", "--", "events.json"], check=True)
          PY
          if git diff --cached --quiet; then
            echo "No actor_group changes to commit."
            exit 0
          fi
          git commit -m "Backfill actor_group on existing events"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Concurrent modification conflict; recovery artifact retained."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 4))
          done
          echo "Push failed; recovery artifact retained."
          exit 1

  deploy:
    needs: recategorize
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout updated repository
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Build lightweight map data (events-lite.json)
        uses: ./.github/actions/build-events-lite
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
