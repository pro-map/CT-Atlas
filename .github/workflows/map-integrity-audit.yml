name: Map evidence integrity audit
on:
  push:
    branches: [fix/map-evidence-integrity-20261022]
    paths: [.github/workflows/map-integrity-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Inspect saved records without AI or source network calls
        run: |
          mkdir -p /tmp/map-integrity-audit
          python - <<'PY'
          import json, pathlib, collections, shutil, hashlib
          import geolocate, geonamescache, feedparser, collector
          out=pathlib.Path('/tmp/map-integrity-audit')
          data=json.loads(pathlib.Path('events.json').read_text()); events=data['events']
          report={'records':len(events),'duplicate_ids':[],'wrong_country_cities':[],'unresolved_cities':[],'same_incident_groups':[]}
          counts=collections.Counter(e['id'] for e in events)
          report['duplicate_ids']=[i for i,n in counts.items() if n>1]
          groups=collections.defaultdict(list)
          for e in events:
              if e.get('incident_id'): groups[(e['incident_id'],e.get('update_type'))].append(e)
              if e.get('location_precision')!='city' or e.get('location_method')!='ai_city_geonames': continue
              name=e.get('city'); country=e.get('country_code')
              city=geolocate.resolve_city(name,country)
              if city: continue
              candidates=geolocate.CITY_INDEX.get(geolocate.normalize_name(name),[])
              gps=[c for c in candidates if abs(float(c['latitude'])-float(e['latitude']))<.01 and abs(float(c['longitude'])-float(e['longitude']))<.01]
              if gps and all(c['countrycode']!=country for c in gps):
                  report['wrong_country_cities'].append({'event':e,'matched_countries':sorted(set(c['countrycode'] for c in gps))})
              else: report['unresolved_cities'].append(e)
          for (iid,stage), group in groups.items():
              if len(group)>1: report['same_incident_groups'].append({'incident_id':iid,'stage':stage,'records':group})
          (out/'audit.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          (out/'baseline.json').write_text(json.dumps(data,ensure_ascii=False))
          for module in (geonamescache,feedparser): shutil.copytree(pathlib.Path(module.__file__).parent,out/'deps'/module.__name__)
          import sgmllib
          shutil.copy(sgmllib.__file__,out/'deps'/pathlib.Path(sgmllib.__file__).name)
          print(json.dumps({k:len(v) if isinstance(v,list) else v for k,v in report.items()}))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: map-evidence-audit
          path: /tmp/map-integrity-audit
          retention-days: 7
