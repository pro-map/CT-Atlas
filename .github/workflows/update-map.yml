name: Daily CT Intelligence Map Update

on:
  schedule:
    - cron: "17 10 * * *"
      timezone: "Europe/Paris"
    - cron: "17 18 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = recent news; backfill-new-sources = regional additions only; backfill = all sources"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - resume-pending
          - backfill-new-sources
          - backfill
      force_ai:
        description: "Re-run all geolocation (ignored for backfill-new-sources)"
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

# Shared with Apply CT Atlas usage upgrade to serialize writes and deployments.
concurrency:
  group: ct-map-update-main
  cancel-in-progress: false
  queue: max

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      checkpoint_outcome: ${{ steps.commit.outcome }}
      data_sha: ${{ steps.commit.outputs.data_sha }}
    env:
      CT_ATLAS_SCHEDULE: ${{ github.event.schedule || '' }}
      COLLECTION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'daily' }}
      FORCE_GEO_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.force_ai || false }}
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Snapshot the full dataset before daily processing
        id: baseline
        run: python -u tools/daily_publication_audit.py snapshot

      - name: Record already processed locations before collection
        id: prepare
        env:
          PRESERVE_FILE: ${{ runner.temp }}/ct-preserve-geo-ids.json
        run: |
          python - <<'PY'
          import json, math, os
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path("events.json")
          data = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {"events": []}
          if not isinstance(data, dict) or not isinstance(data.get("events"), list):
              raise RuntimeError("Invalid existing database; refusing to continue")
          def located(event):
              lat, lon = event.get("latitude"), event.get("longitude")
              if lat is None or lon is None or isinstance(lat, bool) or isinstance(lon, bool):
                  return False
              try:
                  lat, lon = float(lat), float(lon)
                  return math.isfinite(lat) and math.isfinite(lon) and -90 <= lat <= 90 and -180 <= lon <= 180
              except (ValueError, TypeError):
                  return False
          preserve = []
          for event in data["events"]:
              if not isinstance(event, dict):
                  raise RuntimeError("Invalid existing event")
              if event.get("id") is not None and (event.get("ai_geo_complete") is True or located(event)):
                  preserve.append(str(event["id"]))
          Path(os.environ["PRESERVE_FILE"]).write_text(json.dumps(preserve), encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("started_at=" + datetime.now(timezone.utc).isoformat() + "\n")
          print(f"Existing locations/AI decisions protected: {len(preserve)}")
          PY

      - name: Collect multilingual and AI-select CT events
        # Runs take 30-45 min; the limit leaves the geolocation and the
        # always() commit steps their time within the job's 330.
        timeout-minutes: 240
        id: collect
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Background-articles corpus goes to Cloudflare D1; without D1 access
          # collector.py falls back to background-articles.json.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_SELECTION_MODEL: "gemini-3.5-flash-lite"
          AI_SELECTION_BATCH_SIZE: "32"
          AI_SELECTION_MAX_CALLS_PER_RUN: "30"
          AI_SELECTION_DAILY_CALL_BUDGET: "60"
          # Candidates left when 3.5 Flash Lite's budget is spent go to 3.1 Flash
          # Lite (its own free quota) instead of falling off the feeds: 25 a run,
          # 50 a Pacific day, part of the background jobs' share of that model.
          AI_SELECTION_OVERFLOW_MODEL: "gemini-3.1-flash-lite"
          AI_SELECTION_OVERFLOW_MAX_CALLS_PER_RUN: "25"
          AI_SELECTION_OVERFLOW_DAILY_CALL_BUDGET: "50"
          AI_SELECTION_RECENT_PRIORITY_DAYS: "3"
          # These are sub-envelopes, sharing the unchanged request caps above.
          # Recent candidates always run before older recovery or maintenance.
          AI_SELECTION_HISTORICAL_MAX_CALLS_PER_RUN: "10"
          AI_SELECTION_MAINTENANCE_MAX_CALLS_PER_RUN: "2"
        run: |
          set -euo pipefail
          AI_SELECTION_THRESHOLD="$(python - <<'PY'
          import json
          with open("ct-atlas-runtime.json", encoding="utf-8") as handle:
              config = json.load(handle)
          print(int(config["ai_selection_threshold"]))
          PY
          )"
          export AI_SELECTION_THRESHOLD
          echo "AI selection threshold from ct-atlas-runtime.json: $AI_SELECTION_THRESHOLD"
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY GitHub secret is missing."
            exit 1
          fi
          case "$COLLECTION_MODE" in
            resume-pending)
              python -u tools/run_collector_quota_safe.py resume-pending
              ;;
            backfill-new-sources)
              echo "Targeted incremental backfill: Arabic additions, Africa, Afghanistan, Syria, and Latin America."
              python -u tools/run_collector_quota_safe.py backfill-new-sources
              ;;
            backfill)
              echo "Incremental backfill across all configured sources."
              python -u tools/run_collector_quota_safe.py backfill
              ;;
            daily)
              python -u tools/run_collector_quota_safe.py
              ;;
            *) echo "Unknown collection mode"; exit 1 ;;
          esac

      - name: Gemini geolocation with existing-location protection
        id: geolocate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_GEO_MODEL: "gemini-3.5-flash-lite"
          # Deprecated 3.7 redirects to 3.8; deprecated 3.5 Flash redirects
          # to 3.6 (reserved for interactive reports/Deep Search).
          # The optional 3.8 rescue is disabled until account-specific billing
          # tier and rate limits have been checked in Google AI Studio.
          GEMINI_RESCUE_MODELS: "gemini-3.8-flash"
          GEMINI_RESCUE_BILLING_VERIFIED: "false"
          AI_GEO_BATCH_SIZE: "20"
          PRESERVE_FILE: ${{ runner.temp }}/ct-preserve-geo-ids.json
        run: |
          set -euo pipefail
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY GitHub secret is missing."
            exit 1
          fi
          if [ "$COLLECTION_MODE" = "backfill-new-sources" ]; then
            echo "Protecting all previously located/processed events; full refresh is disabled."
            AI_GEO_FORCE=0 AI_GEO_PRESERVE_IDS_FILE="$PRESERVE_FILE" python -u geolocate.py
          elif [ "$COLLECTION_MODE" = "resume-pending" ]; then
            AI_GEO_FORCE=0 AI_GEO_PRESERVE_IDS_FILE="$PRESERVE_FILE" python -u geolocate.py
          elif [ "$FORCE_GEO_REQUESTED" = "true" ]; then
            AI_GEO_FORCE=1 python -u geolocate.py
          else
            AI_GEO_FORCE=0 AI_GEO_PRESERVE_IDS_FILE="$PRESERVE_FILE" python -u geolocate.py
          fi

      - name: Reconcile validated category metadata without AI calls
        id: reconcile
        if: ${{ steps.collect.outcome == 'success' }}
        run: python -u tools/daily_publication_audit.py repair --apply --output "$RUNNER_TEMP/daily-label-repair.json"

      - name: Finalize visible daily progress
        id: finalize_status
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome || 'skipped' }}
          GEOLOCATE_OUTCOME: ${{ steps.geolocate.outcome || 'skipped' }}
          CT_ATLAS_RUN_STARTED_AT: ${{ steps.prepare.outputs.started_at }}
        run: |
          python -u tools/finalize_daily_status.py \
            --collect-outcome "$COLLECT_OUTCOME" \
            --geolocate-outcome "$GEOLOCATE_OUTCOME"

      - name: Record actual dataset changes and trigger timing
        id: audit
        if: ${{ always() && steps.baseline.outcome == 'success' && steps.finalize_status.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CT_ATLAS_RUN_STARTED_AT: ${{ steps.prepare.outputs.started_at }}
        run: python -u tools/daily_publication_audit.py receipt --output "$RUNNER_TEMP/daily-publication-audit.json"

      # Quiz generation is retired; it consumes no model or deployment resources.
      # Independent of collection: the sanctioned-address list is refreshed once a
      # day (and on manual runs). A failed download keeps the previous file.
      - name: Refresh OFAC sanctioned crypto addresses
        if: ${{ always() && steps.checkout.outcome == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '17 10 * * *')) }}
        continue-on-error: true
        run: python -u tools/update_sanctions.py

      - name: Preserve recovery files even if a previous step failed
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: ct-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ai_article_selection_cache.json
            daily_candidate_queue.json
            daily-collection-status.json
            events.json
            ${{ runner.temp }}/daily-publication-audit.json
            ${{ runner.temp }}/daily-label-repair.json
            ${{ runner.temp }}/daily-before.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit database and checkpoints safely
        id: commit
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          STATUS_OUTCOME: ${{ steps.finalize_status.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          RECONCILE_OUTCOME: ${{ steps.reconcile.outcome }}
        run: |
          set -euo pipefail
          git config user.name "CT Intelligence Map Bot"
          git config user.email "actions@github.com"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          if os.environ['AUDIT_OUTCOME'] != 'success':
              raise RuntimeError('Publication audit failed; recovery files retained')
          if os.environ['COLLECT_OUTCOME'] == 'success' and os.environ['RECONCILE_OUTCOME'] != 'success':
              raise RuntimeError('Metadata reconciliation failed; refusing to publish')
          cache = Path("ai_article_selection_cache.json")
          if cache.exists():
              obj = json.loads(cache.read_text(encoding="utf-8"))
              if not isinstance(obj, dict) or not isinstance(obj.get("items"), dict):
                  raise RuntimeError("Invalid AI checkpoint file; recovery artifact retained")
              subprocess.run(["git", "add", "--", str(cache)], check=True)
          queue = Path("daily_candidate_queue.json")
          if queue.exists():
              obj = json.loads(queue.read_text(encoding="utf-8"))
              if not isinstance(obj, dict) or obj.get("version") != 1 or not isinstance(obj.get("events"), list) or not all(isinstance(event, dict) for event in obj["events"]):
                  raise RuntimeError("Invalid daily candidate queue; recovery artifact retained")
              subprocess.run(["git", "add", "--", str(queue)], check=True)
          if os.environ["STATUS_OUTCOME"] != "success":
              raise RuntimeError("Progress finalization failed; refusing to publish an unverified checkpoint")
          # Finalization has restored the Git database when collection failed.
          # Its status-only update still needs publication so failures are visible.
          db = json.loads(Path("events.json").read_text(encoding="utf-8"))
          if not isinstance(db, dict) or not isinstance(db.get("events"), list) or not isinstance(db.get("collection_status"), dict):
              raise RuntimeError("Invalid database/status checkpoint; recovery artifact retained")
          subprocess.run(["git", "add", "--", "events.json"], check=True)
          if Path("daily-collection-status.json").exists():
              subprocess.run(["git", "add", "--", "daily-collection-status.json"], check=True)
          if os.environ["COLLECT_OUTCOME"] == "success":
              # Written together with events.json; only meaningful alongside it.
              if Path("incident_consolidation_state.json").exists():
                  subprocess.run(["git", "add", "--", "incident_consolidation_state.json"], check=True)
              # Map events that aged out of the retention, kept for the background
              # archive (read by the nightly sync-background-corpus run).
              for aged_out in sorted(Path("archive").glob("removed-events-aged-out-*.json")):
                  subprocess.run(["git", "add", "--", str(aged_out)], check=True)
          # A quiz is independent of collection and can be published when collection
          # or geolocation fails, provided the quiz step produced valid files.
          # background-articles.json is likewise independent of whether collection's
          # events.json write succeeded -- it is written incrementally inside
          # ai_select_events() itself, not part of the final database swap above.
          for generated in ("sanctions-crypto.json", "background-articles.json"):
              if Path(generated).exists():
                  subprocess.run(["git", "add", "--", generated], check=True)
          PY
          if git diff --cached --quiet; then
            echo "No database or cache changes to commit."
            echo "data_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update CT database and resumable AI checkpoints"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Concurrent modification conflict; recovery artifact retained."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "data_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 4))
          done
          echo "Push failed; recovery artifact retained."
          exit 1

  deploy:
    needs: update
    # A failed collector can safely publish its restored data plus honest status.
    if: ${{ always() && needs.update.outputs.checkpoint_outcome == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the committed dataset revision
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.update.outputs.data_sha }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Build lightweight map data (events-lite.json)
        uses: ./.github/actions/build-events-lite
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify the data actually served by GitHub Pages
        run: python -u tools/daily_publication_audit.py verify --url "${{ steps.deployment.outputs.page_url }}" --expected publication-manifest.json --output publication-receipt-pages.json
      - name: Retain post-deployment proof even when verification fails
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: daily-publication-proof-${{ github.run_id }}
          path: |
            publication-manifest.json
            publication-receipt-pages.json
          retention-days: 7
          if-no-files-found: ignore
