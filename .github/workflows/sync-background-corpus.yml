name: Sync background corpus to D1

# Loads articles already in the repository (map events' related articles,
# archived removals, the collector's local fallback file, cached Gemini
# reviews) into the ct-atlas-background-articles D1 database. Idempotent
# (INSERT OR IGNORE by URL); it only reads the repository and never commits.
on:
  push:
    branches:
      - main
    paths:
      - "tools/sync_background_corpus.py"
      - ".github/workflows/sync-background-corpus.yml"
  schedule:
    # After the daily collector's evening run (18:17 Europe/Paris) has had time to finish.
    - cron: "47 20 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ct-atlas-background-corpus
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync to D1
        run: python -u tools/sync_background_corpus.py
