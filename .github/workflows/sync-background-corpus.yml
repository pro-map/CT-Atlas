name: Sync background corpus to D1
# cloudflare-worker/schedule-dispatcher.js recognises a started slot by this title.
run-name: ${{ inputs.slot && format('Slot {0}', inputs.slot) || github.workflow }}

# Loads articles already in the repository (map events' related articles,
# archived removals, the collector's local fallback file, cached Gemini
# reviews) into the ct-atlas-background-articles D1 database, one copy per
# story (tools/archive_dedup.py). It only reads the repository and never
# commits. Stored rows the dedup rules reject (off-topic reviews, second
# copies of a story) are deleted (cleanup "apply", the default since the
# owner validated the plan on 2026-10-02); a manual run can choose "plan" to
# only report them.
on:
  push:
    branches:
      - main
    paths:
      - "tools/sync_background_corpus.py"
      - "tools/archive_dedup.py"
      - "radnuc_background.py"
      - "radnuc_background_topics.py"
      - "radnuc-background-keywords.json"
      - "archive/radnuc-background-articles.json"
      - "archive/recovered-events-*.json"
      - "archive/related-overflow-*.json"
      - "archive/enriched-articles-*.json"
      - ".github/workflows/sync-background-corpus.yml"
  schedule:
    # After the map and archive-only RadNuc evening batches have had time to finish.
    - cron: "47 20 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:
    inputs:
      cleanup:
        description: "Stored duplicates and off-topic rows: apply (delete) or plan (report only)"
        type: choice
        options:
          - apply
          - plan
        default: apply
      slot:
        description: "Timed slot this run stands for, sent by the dispatcher; empty for a manual run"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ct-atlas-background-corpus
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ARCHIVE_CLEANUP: ${{ inputs.cleanup || 'apply' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Rebuilds events.json from data/events/ once the store is the database, or checks
      # that the two agree (docs/STORAGE_MIGRATION.md). Before anything reads it.
      - name: Materialize events.json from the store
        run: python3 events_store.py materialize

      - name: Sync to D1
        run: python -u tools/sync_background_corpus.py
