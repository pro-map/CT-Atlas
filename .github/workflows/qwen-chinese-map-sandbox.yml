name: Qwen Chinese whole-map historical sandbox (never publish)

on:
  push:
    branches:
      - experiment/qwen-chinese-all-map-20261010
    paths:
      - .github/workflows/qwen-chinese-map-sandbox.yml
      - tools/qwen_chinese_map_backfill.py
      - tools/qwen_backfill_adapter.py
      - experiments/qwen_chinese_map_sandbox.py
      - chinese-map-backfill-queries.json
      - tests/qwen_chinese_map_test.py

permissions:
  contents: read

concurrency:
  group: qwen-chinese-whole-map-experiment
  cancel-in-progress: true

jobs:
  isolated-chinese-history:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install existing Python dependencies
        run: pip install -r requirements.txt
      - name: Validate eight categories, two scripts, isolated checkpoints, and no Gemini calls
        run: |
          python -m unittest discover -s tests -p 'qwen_chinese_map_test.py'
          python -m unittest discover -s tests -p 'qwen_backfill_test.py'
          python tools/qwen_chinese_map_backfill.py --dry-run
      - name: Install local Ollama without GPU or cloud API
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh --output /tmp/install-ollama.sh
          sh /tmp/install-ollama.sh
      - name: Start Qwen 3.5 4B on free standard runner CPU
        run: |
          set -euo pipefail
          nohup ollama serve > /tmp/qwen-chinese-map-ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags > /dev/null
          ollama pull qwen3.5:4b
      - name: Test bounded real Chinese news retrieval and local Qwen in a temporary copy
        timeout-minutes: 13
        env:
          QWEN_BACKFILL_URL: http://127.0.0.1:11434/api/chat
        run: python -u experiments/qwen_chinese_map_sandbox.py
