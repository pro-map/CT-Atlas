name: Apply CT Atlas logo

on:
  push:
    paths:
      - '.github/workflows/apply-ct-atlas-logo.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update logo references
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'interpol-logo.png'
          new = 'ct-atlas.png'
          count = s.count(old)
          if count == 0:
              raise SystemExit('No interpol-logo.png references found in index.html')
          p.write_text(s.replace(old, new), encoding='utf-8')
          print(f'Replaced {count} logo reference(s).')
          PY

      - name: Validate logo asset and references
        run: |
          test -f ct-atlas.png
          ! grep -q 'interpol-logo.png' index.html
          grep -q 'ct-atlas.png' index.html

      - name: Commit logo reference cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Use CT Atlas logo asset"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build lightweight map data (events-lite.json)
        uses: ./.github/actions/build-events-lite
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
