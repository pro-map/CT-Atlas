name: Backfill GDELT + ACLED (6-month, additive only)

on:
  workflow_dispatch:
    inputs:
      window_days:
        description: "How far back (days) to search GDELT DOC 2.0 and ACLED"
        required: true
        default: "180"
      chunk_days:
        description: "GDELT date-slice size in days (a single query is capped at ~75 results regardless of window length)"
        required: true
        default: "30"
      max_calls:
        description: "Safety cap on Gemini selection calls this run (re-run to continue if reached)"
        required: true
        default: "200"

permissions:
  contents: write
  pages: write
  id-token: write

# Shared with the daily collector, the CT-Action recategorization backfill
# and the usage-upgrade deploy to serialize writes to events.json and Pages
# deployments.
concurrency:
  group: ct-map-update-main
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BACKFILL_WINDOW_DAYS: ${{ inputs.window_days }}
      BACKFILL_CHUNK_DAYS: ${{ inputs.chunk_days }}
      BACKFILL_MAX_CALLS: ${{ inputs.max_calls }}
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Discover new events from GDELT DOC 2.0 and ACLED only
        id: backfill
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY GitHub secret is missing."
            exit 1
          fi
          python -u tools/backfill_gdelt_acled.py

      - name: Gemini geolocation for the newly added events
        id: geolocate
        if: ${{ always() && steps.backfill.outcome == 'success' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_GEO_MODEL: "gemini-3.5-flash-lite"
          GEMINI_RESCUE_MODEL: "gemini-3.6-flash"
          AI_GEO_BATCH_SIZE: "20"
        run: |
          set -euo pipefail
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY GitHub secret is missing."
            exit 1
          fi
          # backfill_gdelt_acled.py only appends new events with no
          # coordinates yet -- geolocate.py's own per-event fingerprint cache
          # (is_cached()) already skips every event that already has a
          # location, so this only spends Gemini calls on the events this
          # run actually added.
          AI_GEO_FORCE=0 python -u geolocate.py

      - name: Preserve recovery artifact even if a previous step failed
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: ct-backfill-gdelt-acled-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ai_article_selection_cache.json
            events.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit database safely
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.backfill.outcome == 'success' }}
        run: |
          set -euo pipefail
          git config user.name "CT Intelligence Map Bot"
          git config user.email "actions@github.com"
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          db = json.loads(Path("events.json").read_text(encoding="utf-8"))
          if not isinstance(db, dict) or not isinstance(db.get("events"), list):
              raise RuntimeError("Invalid database checkpoint; recovery artifact retained")
          subprocess.run(["git", "add", "--", "events.json"], check=True)
          cache = Path("ai_article_selection_cache.json")
          if cache.exists():
              subprocess.run(["git", "add", "--", str(cache)], check=True)
          PY
          if git diff --cached --quiet; then
            echo "No new events or cache changes to commit."
            exit 0
          fi
          git commit -m "Backfill new events from GDELT DOC 2.0 and ACLED (additive only)"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Concurrent modification conflict; recovery artifact retained."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 4))
          done
          echo "Push failed; recovery artifact retained."
          exit 1

  deploy:
    needs: backfill
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout updated repository
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Build lightweight map data (events-lite.json)
        uses: ./.github/actions/build-events-lite
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
