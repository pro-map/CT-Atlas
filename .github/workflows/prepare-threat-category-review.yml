name: Verify standalone threat categories
on:
  push:
    branches: [ct-standalone-threat-categories-20261008]
    paths:
      - .github/workflows/prepare-threat-category-review.yml
      - tools/threat-review-part-*.txt
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ct-standalone-threat-categories-20261008
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Apply hash-verified reviewed source patch
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, subprocess
          from pathlib import Path
          encoded = ''.join(Path(f'tools/threat-review-part-{i}.txt').read_text() for i in range(6))
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '22a59c70a269b99b1ac2e07f41a9469dfdefc0831c733348dbea23f80045eb94', 'Patch integrity mismatch'
          assert b'b/.github/' not in patch, 'Workflow changes require the repository connection'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          p = Path('tools/enrich_threat_categories.py')
          s = p.read_text(); assert 'deadline_minutes=minutes,log=log)' in s
          p.write_text(s.replace('deadline_minutes=minutes,log=log)', 'deadline_minutes=minutes / remaining_categories,log=log)'))
          p = Path('tests/pdf-export-report.test.cjs')
          s = p.read_text(); assert 'const info=JSON.parse(run.stdout);' in s
          s = s.replace('const info=JSON.parse(run.stdout);', 'const info=JSON.parse(run.stdout.trim().split(/\\r?\\n/).at(-1)); // Parser diagnostics may precede the final JSON line.')
          p.write_text(s)
          subprocess.run(['git','add','tools/enrich_threat_categories.py','tests/pdf-export-report.test.cjs'],check=True)
          PY
      - name: Install test dependencies
        run: pip install -r requirements.txt -r darkweb-collector/requirements.txt pytest
      - name: Python regression suite
        run: python -m pytest tests/ -q --ignore=tests/visual_intel_detector_test.py
      - name: JavaScript regression suite
        run: node --test tests/*.test.cjs
      - name: Migrate retained classifications without changing evidence
        run: python tools/migrate_threat_categories.py --write
      - name: Verify map payload and historical search plan
        run: |
          python tools/build_events_map.py --output "$RUNNER_TEMP/events-map.json"
          python tools/enrich_threat_categories.py --dry-run
      - name: Commit tested source and migrated data to review branch
        run: |
          set -euo pipefail
          git rm tools/threat-review-part-*.txt
          git add events.json
          if git diff --cached --name-only | grep -q '^.github/'; then
            echo 'Refusing workflow changes through the runner token'; exit 1
          fi
          git -c core.whitespace=cr-at-eol diff --cached --check
          git config user.name 'CT Atlas Category Migration'
          git config user.email 'actions@github.com'
          git commit -m 'Replace CBRN hierarchy with standalone categories and resumable six-month collection'
          git push origin HEAD:ct-standalone-threat-categories-20261008
