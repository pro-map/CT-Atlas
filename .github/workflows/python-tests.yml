name: Python tests

# The collector, the geolocation, the archive tools and their tests. Until
# this workflow only `node --test` ran in CI (before the Worker deploy), so a
# Python change that broke tests/ could reach the scheduled jobs unnoticed.
# Bot commits (pushed with GITHUB_TOKEN) never trigger it.
on:
  push:
    paths:
      - "collector.py"
      - "radnuc.py"
      - "threat_categories.py"
      - "threat-category-keywords.json"
      - "geolocate.py"
      - "tools/**"
      - "darkweb-collector/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "collector.py"
      - "radnuc.py"
      - "threat_categories.py"
      - "threat-category-keywords.json"
      - "geolocate.py"
      - "tools/**"
      - "darkweb-collector/**"
      - "tests/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r darkweb-collector/requirements.txt pytest

      - name: Run the tests
        env:
          PYTHONIOENCODING: utf-8
        # The face detector's test needs OpenCV and the visual-intel service:
        # deploy-visual-intel.yml runs it inside that service's container.
        run: python -m pytest tests/ -q --ignore=tests/visual_intel_detector_test.py

