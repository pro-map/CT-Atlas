name: Python tests

# The collector, the geolocation, the archive tools and their tests. Until
# this workflow only `node --test` ran in CI (before the Worker deploy), so a
# Python change that broke tests/ could reach the scheduled jobs unnoticed.
# Bot commits (pushed with GITHUB_TOKEN) never trigger it, so the broad "*.py",
# "*.json" and workflow globs cost nothing on data commits: they cover the
# modules the collector and geolocation import (daily_pipeline.py,
# map_evidence_integrity.py...) and the workflows the tests read.
on:
  push:
    paths:
      - "*.py"
      - "*.json"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "collector.py"
      - "collection_config.py"
      - "ct-atlas-runtime.json"
      - "radnuc-keywords.json"
      - "radnuc_vocabulary.py"
      - "chinese-map-backfill-queries.json"
      - "radnuc.py"
      - "radnuc_background.py"
      - "radnuc_background_topics.py"
      - "radnuc-background-keywords.json"
      - ".github/workflows/daily-radnuc-background.yml"
      - "threat_categories.py"
      - "threat-category-keywords.json"
      - "bio-monitoring-keywords.json"
      - "geolocate.py"
      - "tools/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "*.py"
      - "*.json"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "collector.py"
      - "collection_config.py"
      - "ct-atlas-runtime.json"
      - "radnuc-keywords.json"
      - "radnuc_vocabulary.py"
      - "chinese-map-backfill-queries.json"
      - "radnuc.py"
      - "radnuc_background.py"
      - "radnuc_background_topics.py"
      - "radnuc-background-keywords.json"
      - ".github/workflows/daily-radnuc-background.yml"
      - "threat_categories.py"
      - "threat-category-keywords.json"
      - "bio-monitoring-keywords.json"
      - "geolocate.py"
      - "tools/**"
      - "tests/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run the tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests/ -q
