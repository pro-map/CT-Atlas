name: CT Atlas live smoke test

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "main.html"
      - "social.html"
      - "social.js"
      - "social.css"
      - "facial.html"
      - "tab-health.js"
      - "tab-health.css"
      - "pdf-export.js"
      - "deep-search.js"
      - "quick-ask.js"
      - "crypto.html"
      - "crypto.js"
      - "crypto.css"
      - "crypto-launcher.js"
      - "ct-atlas-runtime.json"
      - "daily-quiz.json"
      - "sanctions-crypto.json"
      - "cloudflare-worker/**"
      - "cloudflare-worker/wrangler.toml"
      - ".github/workflows/live-smoke.yml"
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ct-atlas-live-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check public assets
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            if curl --fail --silent --show-error --max-time 25 https://ct-atlas.com/ >/tmp/index.html \
              && curl --fail --silent --show-error --max-time 25 https://ct-atlas.com/pdf-export.js >/tmp/pdf-export.js \
              && curl --fail --silent --show-error --max-time 25 https://ct-atlas.com/crypto.html >/tmp/crypto.html \
              && curl --fail --silent --show-error --max-time 25 https://ct-atlas.com/crypto.js >/tmp/crypto.js \
              && curl --fail --silent --show-error --max-time 25 https://ct-atlas.com/main.html >/tmp/main.html \
              && curl --fail --silent --show-error --max-time 25 https://ct-atlas.com/social.html >/tmp/social.html \
              && curl --fail --silent --show-error --max-time 25 https://ct-atlas.com/social.js >/tmp/social.js \
              && curl --fail --silent --show-error --max-time 25 https://ct-atlas.com/social.css >/tmp/social.css \
              && curl --fail --silent --show-error --max-time 25 https://ct-atlas.com/tab-health.js >/tmp/tab-health.js \
              && curl --fail --silent --show-error --max-time 25 https://ct-atlas.com/facial.html >/tmp/facial.html \
              && grep -q '/health/status' /tmp/tab-health.js \
              && grep -q 'data-health-scope="crypto"' /tmp/crypto.html \
              && grep -q 'data-health-scope="social"' /tmp/social.html \
              && grep -q 'data-health-scope="facial"' /tmp/facial.html \
              && grep -q 'pdf-export.js' /tmp/index.html \
              && grep -q 'window.CTAtlasPdf' /tmp/pdf-export.js \
              && grep -q 'Behavioral Pattern Detection' /tmp/crypto.html \
              && grep -q 'Case Workspace' /tmp/crypto.html \
              && grep -q 'Sanctions Screening' /tmp/crypto.html \
              && grep -q 'renderSanctions' /tmp/crypto.js \
              && grep -q 'detectPatterns' /tmp/crypto.js \
              && grep -q 'crypto-workspace' /tmp/crypto.js \
              && grep -q 'Intelligence Map' /tmp/main.html \
              && grep -q 'Crypto Intelligence' /tmp/main.html \
              && grep -q 'RUN SOCMINT INVESTIGATION' /tmp/social.html \
              && grep -q 'social-investigate' /tmp/social.js \
              && grep -q 'reportWalletsSection' /tmp/social.html \
              && grep -q 'renderWallets' /tmp/social.js \
              && grep -q 'DOWNLOAD PDF' /tmp/social.html; then
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "Updated PDF assets did not become available in time" >&2
              exit 1
            fi
            sleep 10
          done
          curl --fail --silent --show-error --max-time 25 https://ct-atlas.com/ct-atlas-runtime.json >/tmp/runtime.json
          curl --fail --silent --show-error --max-time 25 https://ct-atlas.com/daily-quiz.json >/tmp/quiz.json
          node - <<'NODE'
          const fs = require("fs");
          const runtime = JSON.parse(fs.readFileSync("/tmp/runtime.json", "utf8"));
          const html = fs.readFileSync("/tmp/index.html", "utf8");
          const pdfExporter = fs.readFileSync("/tmp/pdf-export.js", "utf8");
          if (!html.includes("pdf-export.js") || !html.includes("DOWNLOAD PDF")) throw new Error("PDF download UI missing");
          if (!/class="time-button active"\s+data-days="30"/.test(html)) throw new Error("MAP default is not 30 days");
          if (/class="time-button active"\s+data-days="90"/.test(html)) throw new Error("90D must not be the MAP default");
          if (/class="time-button active"\s+data-days="180"/.test(html)) throw new Error("6M must not be the MAP default");
          if (!html.includes("V12 — COMPACT HEADER")) throw new Error("Compact header controls missing");
          if (!html.includes("-webkit-line-clamp: 3")) throw new Error("Situation 24H clamp missing");
          if (!html.includes("max-height: 42px")) throw new Error("Situation 24H text height missing");
          if (html.includes("window.onload=()=>window.print()")) throw new Error("Legacy print dialog still deployed");
          if (!pdfExporter.includes("window.CTAtlasPdf")) throw new Error("PDF exporter missing");
          const quiz = JSON.parse(fs.readFileSync("/tmp/quiz.json", "utf8"));
          if (runtime.ai_selection_threshold !== 60) throw new Error("Runtime threshold drift");
          if (!Array.isArray(runtime.language_codes) || runtime.language_codes.length !== 12) throw new Error("Runtime language drift");
          if (!Array.isArray(quiz.options) || quiz.options.length !== 3) throw new Error("Quiz shape invalid");
          if (!Number.isInteger(quiz.correct_index) || quiz.correct_index < 0 || quiz.correct_index > 2) throw new Error("Quiz answer invalid");
          console.log("Public assets valid.");
          NODE

      # The Worker and GitHub Pages deploy in parallel after a push, and the Worker
      # only reads sanctions-crypto.json once Pages serves it. Give that up to ~6
      # minutes to converge; the strict check below still fails if it never does.
      - name: Wait for the Worker to load the sanctions list
        run: |
          for attempt in {1..24}; do
            if curl --silent --max-time 25 https://ct-report-generator.fairpeace.workers.dev/health | grep -q '"sanctions":{"status":"ok"'; then
              echo "Sanctions list loaded by the Worker."
              exit 0
            fi
            sleep 15
          done
          echo "Worker did not report a loaded sanctions list in time; the strict health check will decide."

      - name: Check Worker health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 25 https://ct-report-generator.fairpeace.workers.dev/health >/tmp/health.json
          node - <<'NODE'
          const fs = require("fs");
          const health = JSON.parse(fs.readFileSync("/tmp/health.json", "utf8"));
          for (const key of ["ok", "deep_search", "quiz_tracking"]) {
            if (health[key] !== true) throw new Error("Worker health flag is not true: " + key);
          }
          if (!health.crypto_version) throw new Error("Crypto backend version missing");
          if (!health.crypto_workspace_version) throw new Error("Crypto workspace version missing");
          if (!health.crypto_monitor_version) throw new Error("Crypto monitor version missing");
          if (!health.sanctions_version) throw new Error("Sanctions screening version missing");
          // The Worker must actually load the list, not merely have a URL configured.
          // "stale" (>7 days old or refresh failed) is a real degradation worth failing on.
          if (!health.sanctions || health.sanctions.status !== "ok") {
            throw new Error("Sanctions list is not healthy in the Worker: " + JSON.stringify(health.sanctions));
          }
          if (!(health.sanctions.address_count > 500)) throw new Error("Sanctions list looks truncated: " + health.sanctions.address_count);
          if (health.crypto_auto_monitoring !== true) throw new Error("Crypto automatic monitoring flag missing");
          if (!health.source_preview_version) throw new Error("Source preview version missing");
          if (!health.social_intel_version) throw new Error("SOCMINT backend version missing");
          if (health.social_intel !== true) throw new Error("SOCMINT backend flag missing");
          if (!health.social_agent_client_version) throw new Error("SOCMINT ADK client version missing");
          if (typeof health.social_agent_configured !== "boolean") throw new Error("SOCMINT ADK configured state missing");
          if (!health.crypto_providers || health.crypto_providers.bitcoin !== true) throw new Error("Bitcoin Crypto provider health missing");
          if (health.crypto_providers.evm !== true) throw new Error("ETHERSCAN_API_KEY is not active in the Worker");
          if (health.crypto_providers.tron !== true) throw new Error("TRONGRID_API_KEY is not active in the Worker");
          if (health.auth_mode !== "secret") {
            throw new Error("Worker authentication is not using the required secret mode: " + health.auth_mode);
          }
          console.log("Worker health valid:", health.version, health.auth_mode);
          NODE

      # The Health status button of the Crypto / Social / Facial tabs reads this
      # endpoint. Only its shape and the Worker itself are asserted: an external
      # provider or a Cloud Run cold start being briefly slow must not fail a deploy.
      - name: Check live health status endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 40 https://ct-report-generator.fairpeace.workers.dev/health/status >/tmp/health-status.json
          node - <<'NODE'
          const fs = require("fs");
          const raw = fs.readFileSync("/tmp/health-status.json", "utf8");
          const status = JSON.parse(raw);
          if (status.ok !== true) throw new Error("Health status is not ok");
          const components = status.components || {};
          for (const key of ["worker", "bitcoin", "evm", "tron", "sanctions", "agent", "visual", "brave", "gemini"]) {
            if (!components[key] || typeof components[key].status !== "string") throw new Error("Health status component missing: " + key);
          }
          if (components.worker.status !== "operational") throw new Error("Worker component is not operational");
          if (/secret|apikey|api_key/i.test(raw)) throw new Error("Health status must not expose credentials");
          console.log("Health status:", Object.entries(components).map(([k, v]) => k + "=" + v.status).join(" "));
          NODE

      - name: Check CORS allowlist
        run: |
          set -euo pipefail
          origins=(
            "https://ct-atlas.com"
            "https://ct-atlas-mirror.fairpeace.workers.dev"
            "https://pro-map.github.io"
          )
          for origin in "${origins[@]}"; do
            curl --fail --silent --show-error --max-time 25               -D /tmp/cors.headers               -o /dev/null               -X OPTIONS               -H "Origin: $origin"               -H "Access-Control-Request-Method: POST"               https://ct-report-generator.fairpeace.workers.dev/health
            grep -Fi "Access-Control-Allow-Origin: $origin" /tmp/cors.headers
          done
