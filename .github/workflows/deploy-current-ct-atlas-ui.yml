name: Deploy current CT Atlas UI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-current-ct-atlas-ui.yml"
      - "pdf-export.js"
      - "deep-search.js"
      - "deep-search.css"
      - "quick-ask.js"
      - "quick-ask.css"
      - "crypto.html"
      - "crypto.js"
      - "crypto.css"
      - "crypto-launcher.js"
      - "usage-auth-fix.js"
      - "index.html"
      - "main.html"
      - "intelligence-map.svg"
      - "crypto-intelligence.svg"
      - "social-intelligence.svg"
      - "social.html"
      - "social.js"
      - "social.css"
      - "facial.html"
      - "facial.js"
      - "facial.css"
      - "facial-intelligence.svg"
      - "tab-health.js"
      - "tab-health.css"
      - "ct-atlas-runtime.json"
      - "daily-quiz.js"
      - "daily-quiz.css"
      - "daily-quiz.json"
      - "daily-quiz-history.json"
      - "sanctions-crypto.json"
      - "feedback.css"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ct-map-update-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Validate updated labels
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'OUR OFFICES' index.html
          grep -q 'CT Atlas Infrastructure' index.html
          grep -q '<div id="disclaimerSubtitle">CT Atlas</div>' index.html
          grep -q 'independent OSINT prototype created for research and analytical purposes' index.html
          grep -q 'OFFICIAL REGIONS' index.html
          grep -q 'MEMBER COUNTRIES' index.html
          grep -q 'INTERPOL_CT_events_' index.html
          test -s pdf-export.js
          grep -q 'window.CTAtlasPdf' pdf-export.js
          grep -q 'DOWNLOAD PDF' index.html
          if grep -q 'window.onload=()=>window.print()' index.html; then
            echo "Legacy print dialog code is still present" >&2
            exit 1
          fi
          test -s daily-quiz.js
          test -s daily-quiz.css
          grep -q 'dailyQuizButton' daily-quiz.js
          grep -q 'launcher.insertBefore(trigger,launcher.firstChild)' daily-quiz.js
          grep -q 'margin:4px 0 3px;padding:9px 10px' daily-quiz.css
          grep -q 'anchor.insertAdjacentElement("afterend",button)' feedback.js
          test -s crypto.html
          test -s crypto.js
          test -s crypto.css
          test -s crypto-launcher.js
          grep -q 'Behavioral Pattern Detection' crypto.html
          grep -q 'Case Workspace' crypto.html
          grep -q 'Monitoring & Alerts' crypto.html
          test -s main.html
          test -s social.html
          grep -q 'Intelligence Map' main.html
          grep -q 'Crypto Intelligence' main.html
          grep -q 'Social Intelligence' main.html
          grep -q 'Facial Intelligence' main.html
          test -s intelligence-map.svg
          test -s crypto-intelligence.svg
          test -s social-intelligence.svg
          test -s facial-intelligence.svg
          test -s facial.html
          test -s facial.js
          test -s facial.css
          grep -q 'RUN VISUAL ANALYSIS' facial.html
          grep -q 'visual-analyze' facial.js
          grep -q 'NON-IDENTIFYING ANALYSIS' facial.html
          node --check facial.js
          grep -q 'Bitcoin Genesis Address — Satoshi Nakamoto' crypto.html
          grep -q 'cryptoGenesisExample' crypto.js
          test -s social.js
          test -s social.css
          grep -q 'RUN SOCMINT INVESTIGATION' social.html
          grep -q 'socialAgentBadge' social.html
          grep -q 'ADK AGENT' social.js
          grep -q 'GEMINI FALLBACK' social.js
          grep -q 'social-investigate' social.js
          grep -q 'DOWNLOAD PDF' social.html
          node --check social.js
          grep -q 'main.html' crypto.html
          grep -q 'reportResultVisuals' index.html
          grep -q 'deepSearchVisuals' deep-search.js
          grep -q 'V12 — COMPACT HEADER' index.html
          grep -q '#sessionActions {' index.html
          grep -q -- '-webkit-line-clamp: 3' index.html
          grep -q 'max-height: 42px' index.html
          grep -q 'class="time-button active"' index.html
          grep -q 'data-days="30"' index.html
          grep -q 'let selectedDays =' index.html
          grep -q '    30;' index.html
          if grep -q 'loadCryptoLauncher' usage-auth-fix.js; then
            echo "Crypto launcher must not load inside MAP workspace" >&2
            exit 1
          fi
          node --check crypto.js
          node --check crypto-launcher.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
