name: Deploy current CT Atlas UI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-current-ct-atlas-ui.yml"
      - "pdf-export.js"
      - "deep-search.js"
      - "deep-search.css"
      - "report-illustration.js"
      - "crypto.html"
      - "crypto.js"
      - "crypto-report.js"
      - "crypto.css"
      - "crypto-launcher.js"
      - "usage-auth-fix.js"
      - "usage-admin.js"
      - "usage-admin.css"
      - "feedback.js"
      - "feedback.css"
      - "sound-effects.js"
      - "sound-check.html"
      - "workspace-ui.js"
      - "workspace-ui.css"
      - "tab-access.js"
      - "index.html"
      - "main.html"
      - "ip.html"
      - "ip.js"
      - "ip.css"
      - "ip-report.js"
      - "ip-intelligence.svg"
      - "darkweb.html"
      - "darkweb.js"
      - "darkweb.css"
      - "darkweb-intelligence.svg"
      - "intelligence-map.svg"
      - "crypto-intelligence.svg"
      - "social-intelligence.svg"
      - "social.html"
      - "social.js"
      - "social.css"
      - "facial.html"
      - "facial.js"
      - "facial-crops.js"
      - "facial.css"
      - "facial-intelligence.svg"
      - "tab-health.js"
      - "tab-health.css"
      - "ct-atlas-runtime.json"
      - "daily-quiz.js"
      - "daily-quiz.css"
      - "daily-quiz.json"
      - "daily-quiz-history.json"
      - "sanctions-crypto.json"
      - "feedback.css"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # UI-only publishing must not wait for the long-running database collector.
  # Both jobs check out an immutable snapshot of main; this job never writes data.
  group: ct-atlas-ui-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Validate updated labels
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'initialiseInterpolOffices' index.html
          grep -q 'fetch("events-map.json")' index.html
          grep -q 'id="databasePanel"' index.html
          grep -q 'id="attackTickerList"' index.html
          grep -q 'CT Atlas Infrastructure' index.html
          grep -q '<div id="disclaimerSubtitle">CT Atlas</div>' index.html
          grep -q 'independent OSINT prototype created for research and analytical purposes' index.html
          grep -q 'OFFICIAL REGIONS' index.html
          grep -q 'MEMBER COUNTRIES' index.html
          grep -q 'INTERPOL_CT_events_' index.html
          test -s pdf-export.js
          grep -q 'window.CTAtlasPdf' pdf-export.js
          grep -q 'DOWNLOAD PDF' index.html
          if grep -q 'window.onload=()=>window.print()' index.html; then
            echo "Legacy print dialog code is still present" >&2
            exit 1
          fi
          test -s daily-quiz.js
          test -s daily-quiz.css
          grep -q 'dailyQuizButton' daily-quiz.js
          grep -q 'launcher.appendChild(trigger)' daily-quiz.js
          grep -q 'mainQuizLauncher' main.html
          grep -q 'daily-quiz.js?v=freshness-20261004' main.html
          node --check daily-quiz.js
          grep -q 'margin:4px 0 3px;padding:9px 10px' daily-quiz.css
          grep -q 'id="feedbackButton"' main.html
          grep -q 'SEND FEEDBACK / REPORT BUG' main.html
          grep -q 'fbWorkspace' feedback.js
          grep -q 'tab-access-stats' usage-admin.js
          grep -q 'data-ct-tab="map"' index.html
          test -s tab-access.js
          test -s crypto.html
          test -s crypto.js
          test -s crypto-report.js
          grep -q 'crypto-report.js' crypto.html
          grep -q 'cryptoReportButton' crypto.html
          grep -q 'exportFullReport' crypto.js
          test -s crypto.css
          test -s crypto-launcher.js
          grep -q 'Behavioral Pattern Detection' crypto.html
          grep -q 'Case Workspace' crypto.html
          grep -q 'Monitoring & Alerts' crypto.html
          test -s ip.html
          test -s ip.css
          test -s ip-intelligence.svg
          node --check ip.js
          node --check ip-report.js
          test -s darkweb.html
          test -s darkweb.css
          test -s darkweb-intelligence.svg
          node --check darkweb.js
          test -s main.html
          test -s social.html
          grep -q 'Intelligence Map' main.html
          grep -q 'Crypto Intelligence' main.html
          grep -q 'Social Intelligence' main.html
          grep -q 'hub-beta">BETA' main.html
          grep -q 'Facial Intelligence' main.html
          test -s intelligence-map.svg
          test -s crypto-intelligence.svg
          test -s social-intelligence.svg
          test -s facial-intelligence.svg
          test -s facial.html
          test -s facial.js
          test -s facial.css
          grep -q 'RUN VISUAL ANALYSIS' facial.html
          grep -q 'visual-analyze' facial.js
          grep -q 'NON-IDENTIFYING ANALYSIS' facial.html
          node --check facial.js
          test -s facial-crops.js
          node --check facial-crops.js
          grep -q 'CTAtlasFaceCrops' facial.js
          grep -q 'THIRD-PARTY SEARCH' facial.html
          grep -q 'cryptoTestExample' crypto.html
          grep -q 'cryptoTestExample' crypto.js
          test -s social.css
          grep -q 'UNDER CONSTRUCTION' social.html
          grep -q '30 free OSINT Industries credits per month' social.html
          grep -q 'international law-enforcement organizations' social.html
          grep -q 'osint.industries/industries/law-enforcement' social.html
          grep -q 'main.html' crypto.html
          grep -q 'reportResultIllustration' index.html
          grep -q 'deepSearchIllustration' deep-search.js
          grep -q 'CTAtlasIllustration' report-illustration.js
          grep -q 'V12 — COMPACT HEADER' index.html
          grep -q '#sessionActions {' index.html
          grep -q -- '-webkit-line-clamp: 3' index.html
          grep -q 'max-height: 42px' index.html
          grep -q 'class="time-button active" data-days="7"' index.html
          grep -q 'data-days="7"' index.html
          grep -q 'let selectedDays =' index.html
          grep -q 'let selectedDays = 7;' index.html
          grep -q '<option value="ALL" selected>All events</option>' index.html
          if grep -q 'loadCryptoLauncher' usage-auth-fix.js; then
            echo "Crypto launcher must not load inside MAP workspace" >&2
            exit 1
          fi
          node --check crypto.js
          node --check crypto-report.js
          node --check pdf-export.js
          node --check crypto-launcher.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Build lightweight map data (events-lite.json)
        uses: ./.github/actions/build-events-lite
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5


