name: Deploy current CT Atlas UI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-current-ct-atlas-ui.yml"
      - "pdf-export.js"
      - "deep-search.js"
      - "deep-search.css"
      - "report-illustration.js"
      - "crypto.html"
      - "crypto.js"
      - "crypto-report.js"
      - "crypto.css"
      - "crypto-launcher.js"
      - "usage-auth-fix.js"
      - "usage-admin.js"
      - "usage-admin.css"
      - "feedback.js"
      - "feedback.css"
      - "sound-effects.js"
      - "sound-check.html"
      - "workspace-ui.js"
      - "workspace-ui.css"
      - "tab-access.js"
      - "tools/build_events_map.py"
      - "tools/build_events_lite.py"
      - "tools/daily_publication_audit.py"
      - "tools/compact_mirror_json.py"
      - "daily_reliability.py"
      - "retired_categories.py"
      - "attack_points.py"
      - "index.html"
      - "main.html"
      - "privacy.html"
      - "robots.txt"
      - "CT-ATLAS.png"
      - "CT-ATLAS-256.png"
      - "vendor/**"
      - "daily-quiz.js"
      - "daily-quiz.css"
      - "daily-quiz.json"
      - "intelligence-map.svg"
      - "crypto-intelligence.svg"
      - "tab-health.js"
      - "tab-health.css"
      - "ct-atlas-runtime.json"
      - "sanctions-crypto.json"
      - "feedback.css"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Serialize checkout through publication with data writers and their deploys.
  # Otherwise an earlier UI checkout can finish last and republish stale data.
  group: ct-map-update-main
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Validate updated labels
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'initialiseInterpolOffices' index.html
          grep -q 'fetch("events-map.json",' index.html
          test -s CT-ATLAS-256.png
          test -s vendor/leaflet-1.9.4/leaflet.js
          test -s vendor/leaflet-1.9.4/leaflet.css
          test -s vendor/leaflet.markercluster-1.5.3/leaflet.markercluster.js
          test -s vendor/leaflet.heat-0.2.0/leaflet-heat.js
          grep -q 'id="databasePanel"' index.html
          grep -q 'id="dataStateBadge"' index.html
          if grep -q 'id="attackTicker"\|id="weeklyAnalysisButton"' index.html; then
            echo "A removed map panel is still present" >&2
            exit 1
          fi
          grep -q 'CT Atlas Infrastructure' index.html
          grep -q 'id="readme"' main.html
          grep -q 'Use only for authorised duties.' main.html
          grep -q 'Do not retain results on CT ATLAS beyond relevance assessment.' main.html
          if grep -q 'id="disclaimerButton"\|id="disclaimerPanel"\|id="operationalDisclaimer"' index.html; then
            echo "Superseded general map disclaimer is still present" >&2
            exit 1
          fi
          grep -q 'OFFICIAL REGIONS' index.html
          grep -q 'MEMBER COUNTRIES' index.html
          grep -q 'INTERPOL_CT_events_' index.html
          test -s pdf-export.js
          grep -q 'window.CTAtlasPdf' pdf-export.js
          grep -q 'DOWNLOAD PDF' index.html
          if grep -q 'window.onload=()=>window.print()' index.html; then
            echo "Legacy print dialog code is still present" >&2
            exit 1
          fi
          # The quiz is retired: validate its absence, not the old launcher.
          if grep -q 'mainQuizLauncher\|<script[^>]*daily-quiz.js' main.html; then
            echo "Retired quiz launcher or client is still active" >&2
            exit 1
          fi
          grep -q 'id="feedbackButton"' main.html
          grep -q 'SEND FEEDBACK / REPORT BUG' main.html
          grep -q 'fbWorkspace' feedback.js
          grep -q 'tab-access-stats' usage-admin.js
          grep -q 'data-ct-tab="map"' index.html
          test -s tab-access.js
          test -s crypto.html
          test -s crypto.js
          test -s crypto-report.js
          grep -q 'crypto-report.js' crypto.html
          grep -q 'cryptoReportButton' crypto.html
          grep -q 'exportFullReport' crypto.js
          test -s crypto.css
          test -s crypto-launcher.js
          grep -q 'Behavioral Pattern Detection' crypto.html
          grep -q 'Case Workspace' crypto.html
          grep -q 'Monitoring & Alerts' crypto.html
          test -s main.html
          grep -q 'Intelligence Map' main.html
          grep -q 'Crypto Intelligence' main.html
          if grep -q 'darkweb\.\|facial\.\|social\.\|ip\.html\|ip-intelligence' main.html; then
            echo "A retired tool is still linked from the main page" >&2
            exit 1
          fi
          test -s intelligence-map.svg
          test -s crypto-intelligence.svg
          grep -q 'cryptoTestExample' crypto.html
          grep -q 'cryptoTestExample' crypto.js
          grep -q 'main.html' crypto.html
          grep -q 'reportResultIllustration' index.html
          grep -q 'deepSearchIllustration' deep-search.js
          grep -q 'CTAtlasIllustration' report-illustration.js
          grep -q 'V12 — COMPACT HEADER' index.html
          grep -q '#sessionActions {' index.html
          grep -q -- '-webkit-line-clamp: 3' index.html
          grep -q 'max-height: 42px' index.html
          grep -q 'class="time-button active" data-days="7"' index.html
          grep -q 'data-days="7"' index.html
          grep -q 'data-days="30"' index.html
          grep -q 'data-days="90"' index.html
          grep -q 'data-days="180"' index.html
          grep -q 'const MAP_RECENT_EVENT_DAYS = 181;' index.html
          grep -q '^RECENT_DAYS = 181$' tools/build_events_map.py
          grep -q 'let selectedDays =' index.html
          grep -q 'let selectedDays = 7;' index.html
          grep -q '<option value="ALL" selected>All events</option>' index.html
          if grep -q '<th>SOCIAL</th>\|SOCIAL MEDIA SEARCH' usage-admin.js; then
            echo "Retired Social statistics are still present" >&2
            exit 1
          fi
          if grep -q 'loadCryptoLauncher' usage-auth-fix.js; then
            echo "Crypto launcher must not load inside MAP workspace" >&2
            exit 1
          fi
          node --check crypto.js
          node --check crypto-report.js
          node --check pdf-export.js
          node --check crypto-launcher.js
      - name: Run the Node regression suite
        # The map and Database logic inline in index.html is covered only here;
        # the Cloudflare mirror deploys this UI only after this workflow succeeds.
        run: node --test tests/*.test.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Build lightweight map data (events-lite.json)
        uses: ./.github/actions/build-events-lite
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: "."
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify the data actually served by GitHub Pages
        run: python3 tools/daily_publication_audit.py verify --url "${{ steps.deployment.outputs.page_url }}" --expected publication-manifest.json --output publication-receipt-pages.json
      - name: Retain Pages publication proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-publication-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            publication-manifest.json
            publication-receipt-pages.json
          retention-days: 7
          if-no-files-found: ignore
