<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CT ATLAS — Social Media Analysis</title>
<link rel="icon" href="CT-ATLAS.png">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;background:#0d1620;color:white}
.social-shell{min-height:100%;display:flex;flex-direction:column}
.social-header{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#111d28;border-bottom:1px solid #314252}
.social-brand{display:flex;align-items:center;gap:12px}.social-brand img{height:48px}.social-title{font-size:16px;font-weight:900;letter-spacing:.06em}.social-sub{margin-top:5px;color:#8097a5;font-size:9px;letter-spacing:.12em}
.main-button{display:inline-block;border:1px solid #405563;border-radius:4px;padding:9px 13px;background:#202f3b;color:white;text-decoration:none;font-size:9px;font-weight:900;letter-spacing:.08em}
.social-main{flex:1;display:flex;align-items:center;justify-content:center;padding:28px}
.placeholder{width:min(680px,100%);padding:46px;text-align:center;border:1px solid #344958;border-radius:8px;background:linear-gradient(180deg,#172630,#111d26);box-shadow:0 20px 55px rgba(0,0,0,.28)}
.placeholder-icon{width:66px;height:66px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;border:1px solid #526672;border-radius:10px;background:#18252c;color:#a7b7c0;font-size:18px;font-weight:900}
.placeholder h1{margin:0;font-size:24px}.badge{display:inline-block;margin-top:14px;padding:6px 9px;border:1px solid #765f34;background:#2b2516;color:#e0c279;border-radius:3px;font-size:9px;font-weight:900;letter-spacing:.1em}
.placeholder p{margin:22px auto 0;max-width:500px;color:#91a5b1;font-size:12px;line-height:1.7}
</style>
</head>
<body>
<div class="social-shell">
<header class="social-header">
  <div class="social-brand"><img src="CT-ATLAS.png" alt="CT Atlas"><div><div class="social-title">SOCIAL MEDIA ANALYSIS</div><div class="social-sub">CT ATLAS · SOCMINT WORKSPACE</div></div></div>
  <a class="main-button" href="main.html">MAIN</a>
</header>
<main class="social-main"><section class="placeholder">
  <div class="placeholder-icon">SOC</div>
  <h1>Social Media Analysis</h1>
  <div class="badge">UNDER CONSTRUCTION</div>
  <p>This workspace is reserved for future SOCMINT analysis functions. No collection or analytical action is currently performed from this page.</p>
</section></main>
</div>
<script>
(async function(){
 const token=String(sessionStorage.getItem("ct_map_session_token")||"");
 if(!token){location.replace("index.html");return;}
 try{
  const r=await fetch("https://ct-report-generator.fairpeace.workers.dev/session-check",{headers:{"X-Session-Token":token},cache:"no-store"});
  const p=await r.json().catch(()=>({})); if(!r.ok||!p.ok)throw new Error();
 }catch(_){location.replace("index.html");}
})();
</script>
</body>
</html>
