name = "ct-report-generator"
main = "index.js"
compatibility_date = "2026-09-02"
compatibility_flags = []

[vars]
EVENTS_URL = "https://ct-atlas.com/events.json"
# Lightweight copy of the events database (only the fields the Worker reads), published next to
# events.json. The Worker falls back to EVENTS_URL if it is missing or unusable.
EVENTS_LITE_URL = "https://ct-atlas.com/events-lite.json"
SANCTIONS_URL = "https://ct-atlas.com/sanctions-crypto.json"
GEMINI_MODEL = "gemini-3.5-flash-lite"
ALLOWED_ORIGIN = "https://ct-atlas.com"
# Comma-separated list of additional origins allowed to call this API --
# mirrors of the static site hosted elsewhere (e.g. for networks that block
# the main domain). See corsHeaders() in shared.js.
EXTRA_ALLOWED_ORIGINS = "https://ct-atlas-mirror.fairpeace.workers.dev,https://pro-map.github.io"
# schedule-dispatcher.js starts the timed workflows only when this is "true" and the secret
# GITHUB_DISPATCH_TOKEN is set in Cloudflare (never commit it). Keep "false" while the
# workflows have their own schedule: triggers, or every slot runs twice.
SCHEDULE_DISPATCH_ENABLED = "false"

[[durable_objects.bindings]]
name = "REPORT_GATE"
class_name = "ReportGate"

[exports.ReportGate]
type = "durable-object"
storage = "sqlite"

# Retired with Facial Intelligence. No binding reaches this namespace; index.js keeps an empty
# class only so the namespace is retained. Do not set state = "deleted" here: that destroys
# its data permanently and is the owner's decision. index.js says how.
[exports.FaceShare]
type = "durable-object"
storage = "sqlite"

# Background reporting corpus (not on the map) used as context by the Report
# Generator and Deep Search; filled by collector.py and
# tools/sync_background_corpus.py. See background-corpus.js.
[[d1_databases]]
binding = "BACKGROUND_DB"
database_name = "ct-atlas-background-articles"
database_id = "7c00bac7-05b6-443c-a305-c2bd9352c857"

# AUTH_USERS_JSON is a required Cloudflare secret containing {"username":"sha256(password)"}.
# The Worker rejects all logins when this secret is missing or invalid; never commit it.
# AUTH_USERS_EXTRA_JSON is an optional secret, same format, for accounts added later
# (tools/make_auth_users.py); it never overrides an AUTH_USERS_JSON password.


# Crypto Intelligence provider secrets (configure in Cloudflare, never commit values):
#   ETHERSCAN_API_KEY  -> Etherscan API V2 for Ethereum, Polygon and Arbitrum One.
#   TRONGRID_API_KEY   -> TronGrid Mainnet API key sent as TRON-PRO-API-KEY.
# Bitcoin uses Blockstream Esplora's public read-only API and needs no secret.


# Automatic Crypto watchlist monitoring. The Worker rotates a maximum of
# 8 monitored wallets per run to protect explorer/API and subrequest quotas.
# The second expression wakes schedule-dispatcher.js and the hourly provider probe
# (crypto-provider-health.js) instead. scheduled() in index.js tells them apart by
# controller.cron, so it must stay identical to DISPATCH_CRON.
[triggers]
crons = ["17 */6 * * *", "7,17,27,37,47,57 * * * *"]
